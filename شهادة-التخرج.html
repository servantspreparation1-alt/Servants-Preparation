<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شهادات التخرج | اعداد خدام ادمن</title>
<meta name="theme-color" content="#f8f8f3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="color-scheme" content="light dark">
<script>
(function(){try{var t=localStorage.getItem('e3dad-theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="assets/css/app.css?v=3.1">
<style>
header.cert-head{background:linear-gradient(135deg,#12325c,#21569c 56%,#c9a227);color:#f4f9ff;padding:24px 18px;border-bottom:4px solid var(--gold);position:relative;overflow:hidden}
header.cert-head .grain{position:absolute;inset:0;background:url("assets/img/church-hero.jpg") center/cover;opacity:.18}
header.cert-head .in{position:relative;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
header.cert-head img.logo{width:66px;height:66px;border-radius:50%;border:2px solid #ffe6b0;object-fit:contain;background:#fff9ef}
header.cert-head h1{margin:2px 0;font-size:23px;color:#fff}
header.cert-head p{margin:0;opacity:.9;font-size:12.5px}
main{max-width:880px;margin:0 auto;padding:20px 14px 48px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.cert{border:4px double var(--gold);border-radius:12px;padding:40px 30px;text-align:center;background:var(--surface);position:relative;overflow:hidden}
.cert:before{content:"☦";position:absolute;font-size:340px;color:rgba(201,162,39,.06);inset-inline-end:-10px;top:-70px;pointer-events:none;line-height:1}
.cert .cross{font-size:42px;color:var(--link)}
.cert h1{font-size:30px;color:var(--head);margin:10px 0 4px;line-height:1.5}
.cert .name{font-size:30px;font-weight:900;color:var(--link);border-bottom:2px solid var(--gold);display:inline-block;padding:0 28px 8px;margin-top:6px}
.cert .verse{color:var(--muted);margin-top:8px}
.signs{display:flex;justify-content:space-between;gap:20px;margin-top:46px;font-size:13px;text-align:center;flex-wrap:wrap}
.signs div{flex:1;min-width:150px}
.signs .line{border-top:1.5px solid var(--text);padding-top:8px}
.cert-foot{font-size:11px;color:var(--muted);margin-top:24px}
.empty{text-align:center;color:var(--muted);padding:26px}
@media(max-width:640px){
  .grid2{grid-template-columns:1fr}
  .cert{padding:26px 16px}
  .cert h1{font-size:23px}
  .cert .name{font-size:22px;padding:0 10px 8px}
  .signs{margin-top:30px;gap:12px}
  header.cert-head h1{font-size:19px}
}
@media print{
  header.cert-head,.no-print{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .card{border:0;box-shadow:none;padding:0;background:#fff}
  .cert{border-width:3px;background:#fff;padding:34px 26px}
  .cert .name,.cert h1,.cert .cross{color:#4a1025!important}
  .cert .verse,.cert-foot{color:#6b5a42!important}
  @page{margin:10mm}
}
</style>
</head>
<body>

<header class="cert-head no-print">
  <div class="grain"></div>
  <div class="in">
    <img class="logo" src="assets/img/logo-512.png" alt="شعار الخدمة">
    <div>
      <h1>شهادات إنهاء وتخرّج إعداد الخدّام</h1>
      <p id="orgLine">معلم الأجيال للتلمذة — كنيسة رئيس الملائكة ميخائيل بالأندلس</p>
    </div>
    <button class="theme-btn round" type="button" data-theme-toggle aria-label="تبديل الوضع الليلي" style="margin-inline-start:auto"><span class="tico">🌙</span></button>
  </div>
</header>

<main>
  <div class="card no-print" style="margin-bottom:15px">
    <div class="grid2">
      <div class="field"><label>اختر الدارس (اللي أنهى سنة بنجاح على الأقل)</label><select id="studentSel"></select></div>
      <div class="field"><label>نوع الشهادة</label>
        <select id="certType">
          <option value="auto">تلقائي حسب حالة الدارس</option>
          <option value="grad">شهادة تخرّج — ٣ سنوات</option>
          <option value="year">شهادة إنهاء سنة</option>
        </select>
      </div>
      <div class="field"><label>تاريخ الإصدار</label><input type="date" id="certDate"></div>
      <div class="field"><label>&nbsp;</label>
        <div style="display:flex;gap:8px">
          <button class="btn gold" style="flex:1" onclick="renderCert()">🎓 عرض الشهادة</button>
          <button class="btn primary" style="flex:1" onclick="window.print()">🖨️ طباعة / PDF</button>
        </div>
      </div>
    </div>
    <a class="btn" href="admin.html" style="margin-top:10px">↩ رجوع للوحة التحكم</a>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.9;margin-bottom:0">الصفحة دي بتقرأ نفس بيانات النظام (نفس الجهاز والمتصفح). لو مش داخل بحساب خادم، هترجعك لصفحة الدخول.</p>
  </div>
  <div class="card" id="certBox"><div class="empty">اختر دارساً ودوس «عرض الشهادة» 🎓</div></div>
</main>

<script src="assets/js/core.js?v=3.1"></script>
<script>
const SESSION_KEY = E3.SESSION_KEY;

let DB = { students: [], users: [], settings: {} };
try {
  DB = JSON.parse(E3.store.getItem(E3.DB_KEY) || '{}');
  DB.students = DB.students || []; DB.users = cleanUsers(DB.users); DB.settings = DB.settings || {};
} catch (e) {}

const sessionId = E3.store.getItem(SESSION_KEY);
const sessionAt = +E3.store.getItem(SESSION_KEY + '_at') || 0;
const me = (DB.users || []).find(u => u.id === sessionId);
const maxMs = me && isLucasOwner(me) ? E3.OWNER_SESSION_MS : E3.SESSION_MS;
if (!me || (me.active === false && !isLucasOwner(me)) || (sessionAt && Date.now() - sessionAt > maxMs)) {
  document.querySelector('main').innerHTML = '<div class="card empty" style="font-size:16px;line-height:2">🔒 لازم تسجل دخولك الأول بحساب خادم<br><a class="btn primary" href="index.html" style="margin-top:12px">تسجيل الدخول</a></div>';
}

const YEAR_NAMES = { 1: 'السنة الأولى', 2: 'السنة الثانية', 3: 'السنة الثالثة' };
function subjFinal(sub) {
  const sc = (sub.assessments || []).filter(a => a.score !== '' && a.score != null && !isNaN(+a.score));
  if (!sc.length) return null;
  const g = sc.reduce((s, a) => s + (+a.score || 0), 0), m = sc.reduce((s, a) => s + (+a.max || 0), 0);
  return m ? Math.round(g / m * 1000) / 10 : null;
}
function enrollOverall(en) {
  const f = (en.subjects || []).map(subjFinal).filter(v => v != null);
  return f.length ? Math.round(f.reduce((a, b) => a + b, 0) / f.length * 10) / 10 : null;
}
function studentAvg(st) {
  const v = (st.enrollments || []).map(enrollOverall).filter(x => x != null);
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null;
}

const settings = DB.settings || {};
if (settings.orgName) document.getElementById('orgLine').textContent = settings.orgName + (settings.church ? ' — ' + settings.church : '');
if (settings.orgLogo) document.querySelectorAll('img.logo').forEach(i => i.src = settings.orgLogo);

const eligible = (DB.students || []).filter(st => (st.enrollments || []).some(e => e.status === 'passed'));
const sel = document.getElementById('studentSel');
sel.innerHTML = eligible.length
  ? eligible.map(st => `<option value="${st.id}">${esc(st.name)} (${esc(st.code)})${st.status === 'graduated' ? ' — 🎓 خريج' : ''}</option>`).join('')
  : '<option value="">لا يوجد دارسون أنهوا سنة بنجاح بعد</option>';
document.getElementById('certDate').value = today();

function renderCert() {
  const st = (DB.students || []).find(x => x.id === sel.value);
  if (!st) { document.getElementById('certBox').innerHTML = '<div class="empty">لا يوجد دارس مؤهل للشهادة بعد — الشهادة بعد أول سنة منتهية بنجاح</div>'; return; }
  const passed = (st.enrollments || []).filter(e => e.status === 'passed');
  const last = passed[passed.length - 1];
  const type = document.getElementById('certType').value;
  const isGrad = type === 'grad' || (type === 'auto' && (st.status === 'graduated' || passed.some(e => e.yearLevel === 3)));
  const date = document.getElementById('certDate').value || today();
  const org = settings.orgName || 'إعداد الخدّام', church = settings.church || '', logo = settings.orgLogo || 'assets/img/logo-512.png';
  const title = isGrad ? 'شهادة تخرّج من خدمة إعداد الخدّام' : 'شهادة إنهاء ' + YEAR_NAMES[last.yearLevel] + ' — إعداد الخدّام';
  const sub = isGrad
    ? 'أنهى بنجاح سنوات إعداد الخدام الثلاث (٣ سنوات) بكل موادها وتقييماتها وأنشطتها وتدريبها العملي'
    : 'أنهى بنجاح متطلبات ' + YEAR_NAMES[last.yearLevel] + ' من برنامج إعداد الخدّام';
  document.getElementById('certBox').innerHTML = `<div class="cert">
    <div class="cross">☦</div>
    <img src="${logo}" style="height:76px;width:76px;object-fit:contain;border-radius:50%;border:2px solid var(--gold);margin-top:8px">
    <div style="font-size:14.5px;color:var(--link);margin-top:8px;font-weight:800">${esc(org)}${church ? ' — ' + esc(church) : ''}</div>
    <h1>${title}</h1>
    <div class="verse">«حَسَناً أَيُّهَا الْعَبْدُ الصَّالِحُ وَالأَمِينُ» (متى ٢٥ : ٢١)</div>
    <p style="font-size:16px;margin-top:26px">تشهد خدمة إعداد الخدام بأن الدارس</p>
    <div class="name">${esc(st.name)}</div>
    <div style="color:var(--muted);margin-top:8px">كود ${esc(st.code)} — ${esc(st.batch || '')}</div>
    <p style="font-size:15.5px;line-height:2;max-width:650px;margin:20px auto 4px">${sub}، بمتوسط عام <b>${studentAvg(st) ?? '—'}%</b> عبر ${(st.enrollments || []).length} محاولة محفوظة في سجله الكامل منذ التحاقه في ${esc(st.joinDate || '—')}.</p>
    <div class="signs">
      <div><div class="line">الأب الكاهن المسؤول عن الخدمة</div></div>
      <div><div class="line">أمين إعداد الخدام<br><small>${esc(me ? (isLucasOwner(me) ? 'إدارة السيستم — مدير النظام' : me.displayName) : '')}</small></div></div>
      <div><div class="line">تاريخ الإصدار<br><b>${esc(date)}</b></div></div>
    </div>
    <div class="cert-foot">شهادة داخلية من خدمة إعداد الخدام — التفاصيل الكاملة بالدرجات والمحاولات في التقرير الشامل للدارس بنظام «اعداد خدام ادمن»</div>
  </div>`;
}
if (eligible.length && me) renderCert();
E3.theme.init();
</script>
</body>
</html>
