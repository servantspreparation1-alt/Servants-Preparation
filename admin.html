   v3 — شريط تابات (بدل القائمة الجانبية) + الهيدر العلوي + الهيرو
   ═══════════════════════════════════════════════════════════════════════════ */

/* الهيكل بقى عمودي: هيدر → هيرو → تابات → المحتوى */
#appRoot.app{display:flex!important;flex-direction:column!important;align-items:stretch}
#appRoot>.main{width:100%;max-width:none;padding-bottom:26px}
#appRoot #view{max-width:1220px}

/* ── الهيدر: لينكات التنقل ── */
.cx-nav .cx-links{max-width:100%;overflow:visible}
.cx-nav .cx-links .nav-item{
  display:inline-flex;align-items:center;gap:5px;width:auto;margin:0;
  padding:8px 13px;border-radius:999px;border:1px solid transparent;
  background:transparent;color:var(--cx-muted);
  font-family:var(--cx-font);font-size:.78rem;font-weight:800;line-height:1.4;
  text-decoration:none;white-space:nowrap;box-shadow:none;transform:none;cursor:pointer;
  transition:background .18s,color .18s,border-color .18s;
}
.cx-nav .cx-links .nav-item .ic{display:none}
.cx-nav .cx-links .nav-item:hover{
  background:var(--cx-gold-soft);color:var(--cx-brand);
  border-color:color-mix(in srgb,var(--cx-gold) 35%,transparent);transform:none;
}
.cx-nav .cx-links .nav-item.active{
  background:var(--cx-gold-soft);color:var(--cx-brand);font-weight:900;
  border-color:color-mix(in srgb,var(--cx-gold) 50%,transparent);
  box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--cx-gold) 65%,transparent);
}
html[data-theme="dark"] .cx-nav .cx-links .nav-item:hover,
html[data-theme="dark"] .cx-nav .cx-links .nav-item.active,
html.dark .cx-nav .cx-links .nav-item:hover,
html.dark .cx-nav .cx-links .nav-item.active{color:var(--cx-gold-2)}

/* ── شريط التابات (اللي جاي من #mainNav) ── */
.tab-bar{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;
  max-width:1220px;margin:22px auto 4px;padding:0 clamp(14px,3vw,26px);
  position:relative;z-index:5;
}
.tab-bar .nav-label{display:none!important}
.tab-bar .nav-item{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;width:auto;margin:0;
  padding:11px 20px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--card-border);
  background:var(--cx-paper);color:var(--cx-muted);
  font-family:var(--cx-font);font-size:.85rem;font-weight:800;line-height:1.4;
  box-shadow:0 6px 18px rgba(90,55,20,.06);
  transition:transform .18s,box-shadow .18s,background .18s,color .18s,border-color .18s;
}
.tab-bar .nav-item .ic{font-size:1rem;line-height:1;width:auto}
.tab-bar .nav-item:hover{
  transform:translateY(-2px);color:var(--cx-brand);background:var(--cx-paper-2);
  border-color:color-mix(in srgb,var(--cx-gold) 55%,var(--card-border));
  box-shadow:0 10px 24px rgba(90,55,20,.12);
}
.tab-bar .nav-item.active{
  background:linear-gradient(90deg,var(--cx-brand-2),var(--cx-brand));
  color:#fff;border-color:transparent;
  box-shadow:0 12px 28px rgba(var(--cx-brand-rgb),.32);
  transform:translateY(-1px);
}
.tab-bar .nav-item.active .ic{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}

/* ── الهيرو في لوحة التحكم ── */
.hero-header.dash{padding:30px 20px 34px}
.hero-header.dash .hero-logo{width:86px;height:86px;border-radius:24px;margin-bottom:12px}
.hero-header.dash h1{font-size:clamp(1.35rem,3.6vw,1.95rem);margin-bottom:4px}
.hero-header.dash .subtitle{font-size:.86rem;max-width:720px}
.hero-header.dash .verse-line{font-size:.9rem;margin-top:12px}

/* ── الدرج الجانبي (الحساب) ── */
.cx-drawer .d-sec{display:grid;gap:8px;margin-top:10px}
.cx-drawer .side-user{background:var(--cx-paper-2);border:1px solid var(--cx-line)}
.cx-drawer .side-user b{color:var(--cx-brand)!important}
.cx-drawer .side-user small{color:var(--cx-muted)}
.cx-drawer .d-verse{font-size:.72rem;color:var(--cx-muted);text-align:center;margin-top:auto;line-height:1.9}

@media(max-width:900px){
  .cx-nav .cx-links{display:none}
  /* التابات: سطر واحد بيتزحلق بدل ما تتقص */
  .tab-bar{
    flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;
    scroll-snap-type:x proximity;padding:0 14px 8px;
    -webkit-overflow-scrolling:touch;
  }
  .tab-bar::-webkit-scrollbar{height:5px}
  .tab-bar::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--cx-gold) 45%,transparent);border-radius:99px}
  .tab-bar .nav-item{flex:0 0 auto;scroll-snap-align:center;padding:10px 16px;font-size:.8rem}
  .hero-header.dash{padding:22px 16px 26px}
  .hero-header.dash .hero-logo{width:70px;height:70px;border-radius:20px}
  .hero-header.dash .verse-line{display:none}
}
@media(max-width:620px){
  .cx-brand-copy{display:none}
  .cx-brand{max-width:none}
  .cx-nav-inner{min-height:60px;gap:6px}
  .cx-actions{gap:6px}
  .cx-icon,.cx-btn-round{width:36px;height:36px}
  #topNewStudent{padding:9px 13px;font-size:.78rem}
  .cx-nav .cx-actions .user-chip{display:flex;padding:3px 8px 3px 4px}
}
@media(max-width:520px){
  .hero-header.dash .subtitle{font-size:.76rem}
  .tab-bar .nav-item{font-size:.76rem;padding:9px 14px}
}


/* ── ضبط صف الهيدر: مفيش تراكب ومفيش قص ── */
.cx-nav-inner{gap:8px;flex-wrap:nowrap;width:min(1440px,calc(100% - 20px))}
.cx-brand{flex:0 1 auto;max-width:230px}
.cx-brand-copy b{font-size:.9rem}
.cx-links{flex:1 1 auto;justify-content:center;min-width:0;overflow:hidden}
.cx-actions{flex:0 0 auto}
.cx-nav .cx-links .nav-item{padding:7px 9px;font-size:.72rem;gap:4px}
.cx-nav .cx-actions .user-chip small{font-size:10px}
@media(max-width:1330px){ .cx-nav .cx-actions .user-chip{display:none} }
.cx-nav .cx-links .nav-item .ic{display:none}
@media(max-width:1400px){ .cx-brand{max-width:190px} .cx-nav .cx-links .nav-item{font-size:.71rem;padding:6px 8px} }
@media(max-width:1240px){ .cx-links .nav-item[data-view="help"],.cx-links .nav-item[data-view="curriculum"]{display:none!important} }
@media(max-width:1080px){ .cx-links .nav-item[data-view="users"],.cx-links .nav-item[data-view="reports"]{display:none!important} .cx-clock{display:none} }
@media(max-width:900px){ .cx-links{display:none!important} }

/* ═══════ v3 — تجربة الموبايل: البوب أب فوق الشريط السفلي ومفيش زرار مقفول تحته ═══════
   القاعدة: أي نافذة منبثقة لازم تفضّي ارتفاع الشريط السفلي الثابت (٨٦px)
   + مساحة الأمان (env(safe-area-inset-bottom)) عشان زرار «حفظ/تأكيد»
   ميقعش تحت الشريط ولا تحت شريط الجهاز (آيفون/أندرويد). */
@media(max-width:900px){
  .modal-bg{padding:14px 10px calc(88px + env(safe-area-inset-bottom,0px))}
  .modal{max-height:calc(100dvh - 112px - env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch}
  .app-confirm-bg{padding:16px 12px calc(88px + env(safe-area-inset-bottom,0px))}
  .app-confirm{max-height:calc(100dvh - 124px);overflow-y:auto}
}
html[data-theme="dark"] .mobile-nav,html.dark .mobile-nav{box-shadow:0 -8px 28px rgba(0,0,0,.5)}
/* نافذة التأكيد: توسيط آمن حتى لو المحتوى أطول من الشاشة */
.app-confirm{margin:auto}

/* تحسينات عامة (v3 fixes) */
html{scroll-behavior:smooth}
#view{min-height:40vh}
.card,.student-card,.table-scroll{scroll-margin-top:90px}
.cx-nav,.tab-bar,.hero-header{isolation:isolate}
button{font-family:var(--cx-font)}



/* ═══════════════════════════════════════════════════════════════════════════
   v4 — إصلاحات (فوتر / كروت / موبايل / زر التثبيت)
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── 1) مفيش فراغ بعد الفوتر: الفوتر آخر عنصر وملزوق في آخر الشاشة ── */
html,body{min-height:100%}
#appRoot.app{min-height:100dvh;display:flex;flex-direction:column}
#appRoot .main{flex:1 0 auto;display:flex;flex-direction:column;padding-bottom:0}
#view{min-height:0!important}
.site-foot{
  margin-top:auto!important;flex:0 0 auto;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
}
body.cert-page,body.login-page{display:flex;flex-direction:column;min-height:100dvh}
body.cert-page main,body.login-page main{flex:1 0 auto}
@media(max-width:900px){
  #appRoot.app{padding-bottom:70px}   /* مساحة شريط التنقل السفلي — مش فوق الفوتر */
  .site-foot{padding-bottom:14px}
}

/* ── 2) كروت الدارسين: واخدة راحتها ── */
.student-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.student-card{
  display:flex;flex-direction:column;gap:0;
  padding:16px 17px 8px;border-radius:20px;
}
.student-card::before{width:5px;opacity:.9}
.student-head{gap:12px;align-items:center;min-height:46px}
.student-card .avatar{width:46px;height:46px;flex:0 0 46px;font-size:1.05rem}
.student-head b{font-size:.95rem;line-height:1.35;margin-bottom:2px}
.student-head small{font-size:.69rem;line-height:1.6}
.student-card .grade{min-width:48px;height:36px;border-radius:13px;font-size:.95rem;padding:0 10px}
.student-card>div:nth-child(2){
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  margin:12px 0 6px!important;padding-bottom:12px;
  border-bottom:1px dashed color-mix(in srgb,var(--cx-line) 85%,transparent);
}
.student-card .kv{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 0;font-size:.8rem;border-bottom:1px dashed color-mix(in srgb,var(--cx-line) 70%,transparent);
}
.student-card .kv span{color:var(--cx-muted);font-weight:700;letter-spacing:.1px}
.student-card .kv b{color:var(--cx-ink);font-weight:900;font-size:.82rem}
.student-card .kv:last-child{border-bottom:0;padding-bottom:10px}
html[data-theme="dark"] .student-card .kv b,html.dark .student-card .kv b{color:var(--cx-gold-2)}
.student-card:hover .grade{transform:scale(1.04)}
.student-card .grade{transition:transform .18s}

/* ── 3) زر التثبيت في الشريط العلوي ── */
.cx-install{
  display:inline-flex;align-items:center;gap:6px;width:auto;padding:0 13px;height:38px;
  border-radius:999px;cursor:pointer;font-family:var(--cx-font);font-size:.76rem;font-weight:800;
  border:1px solid color-mix(in srgb,var(--cx-gold) 45%,var(--cx-line));
  background:var(--cx-gold-soft);color:var(--cx-gold);
  transition:.18s;white-space:nowrap;
}
.cx-install:hover{background:linear-gradient(90deg,var(--cx-gold-2),var(--cx-gold));color:#2b1d02;border-color:transparent}
.cx-install .i{font-size:.9rem}
html[data-theme="dark"] .cx-install,html.dark .cx-install{color:var(--cx-gold-2)}
.cx-install[hidden]{display:none!important}
@media(max-width:900px){
  .cx-install{padding:0;width:36px;height:36px;justify-content:center}
  .cx-install .lbl{display:none}
}
@media(max-width:620px){
  /* على الموبايل: زر التثبيت أيقونة صغيرة في نفس الشريط */
  .cx-install{width:36px;height:36px;padding:0;justify-content:center}
  .cx-install .lbl{display:none}
}

/* ── 3.5) منع أي سكرول أفقي: التابات تفضل بعرض الشاشة ── */
#appRoot.app{max-width:100%;overflow-x:clip}
.tab-bar{width:100%;max-width:100%;min-width:0;box-sizing:border-box}
@media(max-width:900px){
  .tab-bar{flex-wrap:nowrap!important;overflow-x:auto!important}
}

/* ── 4) تظبيطات موبايل ── */
@media(max-width:900px){
  .tab-bar{margin-top:16px}
  .hero-header.dash{padding:20px 15px 24px;border-end-start-radius:24px;border-end-end-radius:24px}
  #view{padding:14px 13px 8px}
  .card{padding:16px 14px}
  .grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}
  .grid.c4{gap:10px}
  .stat{padding:14px 12px;display:flex;align-items:center;gap:12px;text-align:start}
  .stat>div:not(.icbox){flex:1;min-width:0}
  .stat .icbox{margin:0;width:44px;height:44px;flex:0 0 44px}
  .stat span{margin:0;font-size:.72rem}
  .stat b{font-size:1.25rem;margin-top:1px}
  .stat .trend{margin-top:3px;font-size:.66rem}
  .student-grid{grid-template-columns:1fr}
  .mobile-nav{padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .mobile-nav button{font-size:.6rem}
}
@media(max-width:760px){
  /* إحصائيات ٢×٢ على الموبايل بدل كارت ورا كارت */
  .grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{flex-direction:row;align-items:center;gap:9px;padding:11px 10px}
  .stat .icbox{width:34px;height:34px;border-radius:11px;font-size:.95rem;flex:0 0 34px}
  .stat span{font-size:.63rem;line-height:1.35}
  .stat b{font-size:1rem;line-height:1.2}
  .stat .trend{display:none}
  /* التابات: هامش داخلي + تلاشي على الحرف */
  .tab-bar{padding-inline:14px;mask-image:linear-gradient(to left,transparent 0,black 14px,black calc(100% - 14px),transparent 100%)}
}
@media(max-width:360px){
  .grid.c4{grid-template-columns:1fr}
}
@media(max-width:520px){
  .cx-actions{gap:5px}
  #topNewStudent{padding:8px 11px;font-size:.75rem}
  .hero-header.dash h1{font-size:1.25rem}
  .hero-header.dash .hero-logo{width:64px;height:64px;border-radius:18px}
  .style-sec,.sec{font-size:.95rem}
}

/* ── 4.5) تهدية ظل الهيرو (كان بيعمل خط غامق تحت الهيرو) ── */
.hero-header{box-shadow:0 10px 26px rgba(var(--cx-brand-rgb),.14)!important}
.hero-header::after{opacity:.55}

/* ── 4.6) الوضع الليلي: أزرار/تابات بلون أغمق (تباين أفضل) ── */
html[data-theme="dark"] .btn.primary,html.dark .btn.primary,
html[data-theme="dark"] .tab-bar .nav-item.active,html.dark .tab-bar .nav-item.active,
html[data-theme="dark"] .gz-submit,html.dark .gz-submit,
html[data-theme="dark"] .nav-item.active,html.dark .nav-item.active{
  background:linear-gradient(90deg,#1b5390,#2f7fc4)!important;
  color:#fff!important;border-color:transparent!important;
}
html[data-theme="dark"] .btn.gold,html.dark .btn.gold{
  background:linear-gradient(90deg,#e6c766,#c9a227)!important;color:#241a02!important;
}
html[data-theme="dark"] .cx-clock,html.dark .cx-clock{background:rgba(201,162,39,.14)}
html[data-theme="dark"] .stat .icbox,html.dark .stat .icbox{background:rgba(201,162,39,.12)}

/* ── 5) لمسات جمالية إضافية ── */
.card{transition:box-shadow .22s,border-color .22s}
.card:hover{box-shadow:var(--cx-shadow)}
.kv{padding:9px 2px}
.table-scroll{box-shadow:var(--cx-shadow-sm)}
.site-foot .verse{letter-spacing:.2px}
#view>*:last-child{margin-bottom:18px}


/* ═══════════════════════════════════════════════════════════════════════════
   v5 — الشريط العلوي المنظّم + التابات ٥/٤
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── الشريط العلوي ── */
.cx-nav-inner{width:min(1560px,calc(100% - 20px));gap:10px}
.cx-brand{max-width:210px}
.cx-links{flex:1 1 auto;justify-content:center;min-width:0}
.cx-nav .cx-links .nav-item{padding:7px 11px;font-size:.76rem;white-space:nowrap}
.cx-actions{gap:7px;align-items:center}
.cx-sep{
  width:1px;height:22px;border-radius:2px;flex:0 0 1px;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--cx-gold) 45%,transparent),transparent);
}
.cx-install{
  display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;
  cursor:pointer;font-family:var(--cx-font);font-size:.76rem;font-weight:900;
  background:linear-gradient(90deg,var(--cx-gold-2),var(--cx-gold));
  color:#2b1d02;border:1px solid transparent;white-space:nowrap;
  box-shadow:0 8px 20px rgba(201,162,39,.32);transition:.18s;
}
.cx-install:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(201,162,39,.42)}
.cx-install .i{font-size:.9rem;line-height:1}
.cx-install[hidden]{display:none!important}

.cx-bell{position:relative}
.cx-bell .dot{
  position:absolute;top:6px;inset-inline-end:7px;width:7px;height:7px;border-radius:50%;
  background:var(--cx-danger);box-shadow:0 0 0 2px var(--cx-paper);
}
.cx-icon.cx-logout{color:var(--cx-danger);border-color:color-mix(in srgb,var(--cx-danger) 32%,var(--cx-line))}
.cx-icon.cx-logout:hover{background:var(--cx-danger);color:#fff;border-color:transparent}
.user-chip{cursor:pointer;transition:.18s}
.user-chip:hover{background:var(--cx-gold-soft);border-color:color-mix(in srgb,var(--cx-gold) 45%,var(--cx-line))}
#topNewStudent{padding:10px 16px;font-size:.8rem}

/* استجابة تدريجية */
.cx-nav .cx-actions .user-chip{display:flex!important;align-items:center}
.cx-nav .cx-actions .user-chip .avatar{width:30px;height:30px;flex:0 0 30px;font-size:12px}
.cx-nav .cx-actions .user-chip b{display:block;font-size:12px;line-height:1.25;color:var(--cx-brand)}
.cx-nav .cx-actions .user-chip small{display:block;font-size:10px;line-height:1.25;color:var(--cx-muted)}   /* إلغاء قاعدة قديمة كانت بتخفيه */
@media(max-width:1500px){ .cx-clock{display:none} }
@media(max-width:1360px){ .cx-brand{max-width:180px} .cx-nav .cx-links .nav-item{padding:6px 9px;font-size:.73rem} }
@media(max-width:1280px){ #topLinks .nav-item[data-view="help"],#topLinks .nav-item[data-view="settings"]{display:none!important} }
@media(max-width:1250px){ #topLinks .nav-item[data-view="users"],#topLinks .nav-item[data-view="curriculum"]{display:none!important}
  .cx-install .lbl{display:none} .cx-install{width:38px;padding:0;justify-content:center} }
@media(max-width:1020px){ #topLinks .nav-item[data-view="reports"],#topLinks .nav-item[data-view="tasks"]{display:none!important} }
@media(max-width:980px){ .cx-links{display:none!important} .cx-burger{display:inline-grid} }
@media(max-width:820px){
  .cx-brand-copy{display:none} .cx-brand{max-width:none}
  .cx-sep{display:none}
  .user-chip>div:nth-child(2){display:none}
  .user-chip{padding:3px 4px}
}
@media(max-width:620px){
  .cx-nav-inner{gap:6px;min-height:60px;width:calc(100% - 12px)}
  .cx-actions{gap:6px}
  .cx-icon,.cx-install{width:37px;height:37px;font-size:.92rem}
  #topNewStudent{width:37px;height:37px;padding:0;border-radius:999px;font-size:1rem;display:inline-grid;place-items:center}
  #topNewStudent .t{display:none}
  .cx-nav .cx-actions .user-chip{padding:2px;border:0;background:transparent}
  .cx-nav .cx-actions .user-chip .avatar{width:34px;height:34px;flex:0 0 34px}
  .cx-bell{display:none}          /* الجرس في الموبايل جوه الدرج */
  .cx-icon.cx-logout{display:none} /* تسجيل الخروج في الدرج */
}

/* ── التابات: ٥ في السطر (والباقي متوسّط) ── */
.tab-bar{
  display:flex!important;flex-wrap:wrap;gap:10px 12px;justify-content:center;
  max-width:1120px;margin:22px auto 6px;padding:0 20px;
  overflow:visible!important;mask-image:none!important;
}
.tab-bar .nav-label{display:none!important}
.tab-bar .nav-item{
  flex:0 1 calc((100% - 48px) / 5);min-width:0;
  padding:11px 14px;font-size:.83rem;justify-content:center;border-radius:999px;
}
@media(max-width:900px){
  /* الموبايل: سطر واحد بيتزحلق + تلاشي على الطرفين (زي شمامسة) */
  .tab-bar{
    max-width:100%;padding:0 14px 6px;margin-top:14px;
    flex-wrap:nowrap!important;justify-content:flex-start!important;
    overflow-x:auto!important;overflow-y:hidden;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
    mask-image:linear-gradient(to left,transparent 0,black 16px,black calc(100% - 16px),transparent 100%);
  }
  .tab-bar::-webkit-scrollbar{height:4px}
  .tab-bar::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--cx-gold) 45%,transparent);border-radius:99px}
  .tab-bar .nav-item{
    flex:0 0 auto!important;scroll-snap-align:center;
    padding:10px 15px;font-size:.79rem;gap:6px;border-radius:999px;
  }
  .tab-bar .nav-item .ic{font-size:.95rem}
}
@media(max-width:420px){
  .tab-bar .nav-item{font-size:.75rem;padding:9px 13px}
}


/* ═══════════════════════════════════════════════════════════════════════════
   v5 — الوضع الليلي: كحلي ليلي عميق + ذهب + صلبان خافتة (زي شمامسة)
   ═══════════════════════════════════════════════════════════════════════════ */
html[data-theme="dark"],html.dark{
  color-scheme:dark;
  --cx-bg:#0a1220;
  --cx-paper:#101a28;
  --cx-paper-2:#16202f;
  --cx-line:#24303f;
  --cx-line-2:#1e2937;
  --cx-ink:#e8eef6;
  --cx-muted:#9fb0c2;
  --cx-brand:#7fb8f0;
  --cx-brand-2:#3b8ad6;
  --cx-brand-3:#9ccbf4;
  --cx-brand-rgb:127,184,240;
  --cx-brand-2-rgb:59,138,214;
  --cx-brand-3-rgb:156,203,244;
  --cx-gold:#d8b45f;
  --cx-gold-2:#ecd08c;
  --cx-gold-3:#f7e6b8;
  --cx-gold-soft:#241f15;
  --cx-grad-hero:linear-gradient(158deg,#04080f 0%,#08182a 34%,#0f3355 68%,#1c4f86 100%);
  --bg-body:var(--cx-bg);
  --bg-card:var(--cx-paper);
  --card-border:rgba(216,180,95,.20);
  --text-main:var(--cx-ink);
  --text-sub:var(--cx-muted);
  --title-select:#9ccbf4;
  --surface:var(--cx-paper);
  --surface-2:var(--cx-paper-2);
  --line:var(--cx-line);
  --head:#bfe0fb;
  --muted:var(--cx-muted);
  --link:#9ccbf4;
  --text:var(--cx-ink);
  --field-bg:rgba(255,255,255,.045);
  --field-border:rgba(156,203,244,.28);
  --gz-soft:#241f15;
  --gz-line:#24303f;
  --gz-mut:#9fb0c2;
  --gz-navy:#1c4f86;
  --cx-shadow:0 20px 55px rgba(0,0,0,.55);
  --cx-shadow-sm:0 10px 30px rgba(0,0,0,.42);

.sx-count{color:var(--cx-muted);font-size:.8rem;font-weight:700;margin:2px 4px 10px}
.sx-list{display:flex;flex-direction:column;gap:10px}
.sx-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--cx-paper);border:1px solid var(--card-border);cursor:pointer;transition:.18s}
.sx-row:hover{border-color:var(--cx-gold);transform:translateY(-1px);box-shadow:var(--cx-shadow-sm)}
.sx-av{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:var(--cx-grad);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.05rem;border:2px solid var(--cx-gold-2)}
.sx-av.lg{width:62px;height:62px;flex-basis:62px;font-size:1.5rem}
.sx-grow{flex:1;min-width:0}
.sx-name{font-weight:900;color:var(--cx-ink);font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx-sub{font-size:.75rem;color:var(--cx-muted);font-weight:600;margin-top:2px}
.sx-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sx-go{color:var(--cx-gold);font-size:1.3rem;font-weight:900}
.sx-empty{text-align:center;padding:38px 18px;color:var(--cx-muted);background:var(--cx-paper);border:1.5px dashed var(--card-border);border-radius:20px}
.sx-empty .big{font-size:2.2rem;margin-bottom:6px}
.sx-empty p{margin:0 0 14px;font-weight:700;font-size:.9rem}
.sx-back{margin-bottom:12px}
.sx-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sx-head .sx-grow h2{margin:0 0 6px;font-size:1.2rem;color:var(--cx-brand)}
.sx-acts{display:flex;gap:8px;flex-wrap:wrap}
.sx-info{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--cx-line)}
.sx-info div{background:var(--cx-paper-2);border-radius:12px;padding:8px 12px}
.sx-info small{display:block;color:var(--cx-muted);font-size:.7rem;font-weight:800}
.sx-info b{font-size:.85rem;color:var(--cx-ink);word-break:break-word}
.sx-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 2px 10px}
.sx-title h3{margin:0;font-size:1.02rem;color:var(--cx-brand)}
.sx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.sx-sc{padding:16px}
.sx-sc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sx-sc-head h4{margin:0;font-size:.98rem;color:var(--cx-brand)}
.sx-crit{display:grid;grid-template-columns:1fr 92px auto;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--cx-line)}
.sx-crit>span{font-weight:800;font-size:.83rem}
.sx-crit>small{color:var(--cx-muted);font-weight:700;font-size:.78rem;min-width:44px}
.sx-crit input.sx-grade{padding:8px 6px;text-align:center;border-radius:12px;font-weight:800}
.sx-crit input.bad{border-color:var(--cx-danger);background:rgba(179,64,63,.08)}
.sx-total{margin-top:12px}
.sx-total-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;font-size:.82rem}
.sx-total-top b{font-size:1.25rem;color:var(--cx-brand)}
.sx-track{height:9px;border-radius:99px;background:var(--cx-line-2);overflow:hidden;margin-top:6px}
.sx-fill{height:100%;width:0;background:linear-gradient(90deg,var(--cx-brand-3),var(--cx-brand-2));border-radius:99px;transition:width .25s}
.sx-note{font-size:.72rem;color:var(--cx-muted);font-weight:700;margin-top:5px;min-height:1em}
.sx-subj{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:18px;background:var(--cx-paper);border:1px solid var(--card-border)}
.sx-subj .sx-name{white-space:normal;font-size:1rem}
.sx-subj .sx-tags{margin-top:8px}
/* فورم المودال */
.sx-mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.sx-mh h3{margin:4px 0 0}
.sx-x{border:0;background:var(--cx-paper-2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.1rem;color:var(--cx-muted)}
.sx-x:hover{background:var(--cx-gold-soft)}
.sx-sec{margin:18px 0 10px;font-weight:900;color:var(--cx-brand);font-size:.9rem;display:flex;align-items:center;gap:8px}
.sx-sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--cx-line),transparent)}
.sx-fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sx-fg .full{grid-column:1/-1}
.sx-f{display:flex;flex-direction:column;gap:6px;min-width:0}
.sx-f>label,.sx-f>b{font-size:.78rem;font-weight:800;color:var(--cx-muted)}
.sx-f .req{color:var(--cx-danger)}
.sx-seg{display:flex;gap:8px}
.sx-seg label{flex:1;position:relative;margin:0}
.sx-seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.sx-seg span{display:block;text-align:center;padding:10px 8px;border:1.5px solid var(--field-border);border-radius:14px;font-weight:800;font-size:.84rem;background:var(--field-bg);color:var(--cx-muted);transition:.15s}
.sx-seg input:checked+span{background:var(--cx-grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(var(--cx-brand-rgb),.25)}
.sx-seg input:focus-visible+span{outline:3px solid rgba(195,146,43,.35)}
.sx-hint{font-size:.72rem;color:var(--cx-muted);font-weight:600}
.sx-cr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 12px;border:1.5px solid var(--cx-line);border-radius:14px;margin-bottom:8px;background:var(--cx-paper-2);transition:.15s}
.sx-cr.on{border-color:var(--cx-gold);background:var(--cx-gold-soft)}
.sx-cr label{display:flex;align-items:center;gap:9px;font-weight:800;font-size:.88rem;cursor:pointer;margin:0}
.sx-cr .mx{display:flex;align-items:center;gap:7px;font-size:.75rem;font-weight:800;color:var(--cx-muted)}
.sx-cr .mx input{width:82px;padding:7px 8px;text-align:center;border-radius:11px}
.sx-cr:not(.on) .mx{opacity:.35;pointer-events:none}
#toast{inset-inline:auto;left:50%;right:auto;width:max-content;max-width:min(92vw,560px);transform:translate(-50%,14px)}
#toast.show{transform:translate(-50%,0)}
@media(max-width:560px){.sx-fg{grid-template-columns:1fr}.sx-grid{grid-template-columns:1fr}.sx-seg span{font-size:.78rem;padding:9px 4px}.sx-row .sx-tags.hide-s{display:none}}
.sx-av{overflow:hidden}
.sx-av img{width:100%;height:100%;object-fit:cover;display:block}
.sx-join{flex:0 1 190px;min-width:150px}
.sx-photo{display:flex;gap:14px;align-items:center;margin:10px 0 2px}
.sx-ph{position:relative;width:86px;height:86px;flex:0 0 86px;border-radius:50%;border:2.5px solid var(--cx-gold);background:var(--cx-paper-2);cursor:pointer;display:grid;place-items:center;font-size:2.2rem;margin:0}
.sx-ph #phPrev{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.sx-ph #phPrev img{width:100%;height:100%;object-fit:cover}
.sx-ph i{position:absolute;bottom:-2px;inset-inline-start:-2px;width:30px;height:30px;border-radius:50%;background:var(--cx-grad);display:grid;place-items:center;font-size:.9rem;font-style:normal;border:2px solid #fff}
.sx-crit{grid-template-columns:1fr 84px auto 46px}
.sx-crit .sx-p{font-style:normal;font-weight:900;font-size:.78rem;color:var(--cx-brand-2);text-align:start;min-width:40px}
.sx-w{font-style:normal;font-size:.66rem;color:var(--cx-muted);font-weight:700;margin-inline-start:6px}
.sx-sc-head .btn{flex:0 0 auto}
.sx-cust{margin:12px 0 4px;padding:12px;border-radius:16px;background:var(--cx-paper-2);border:1.5px dashed var(--cx-gold)}
.sx-cust p{margin:0 0 10px}
.sx-cust .sx-cr{background:var(--cx-paper)}
.sx-cust .sx-cr.on{background:var(--cx-gold-soft)}
.sx-cr{grid-template-columns:1fr auto auto}
.sx-cr .wt{display:none;align-items:center;gap:7px;font-size:.75rem;font-weight:800;color:var(--cx-muted)}
.sx-cr .wt input{width:70px;padding:7px 8px;text-align:center;border-radius:11px}
.wcustom .sx-cr .wt{display:flex}
.wcustom .sx-cr:not(.on) .wt{opacity:.35;pointer-events:none}
.sx-wbox{display:none}
.wcustom .sx-wbox{display:block}
.sx-wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:560px){.sx-cr{grid-template-columns:1fr}.sx-cust .sx-cr{grid-template-columns:1fr}.sx-crit{grid-template-columns:1fr 78px auto 42px}}
</style>

/* ===== منطق المعايير والحساب ===== */
/* معايير الدارس الفعلية = معايير المادة + أي تخصيص خاص بالدارس (إضافة / استبعاد) */
function effCrit(sub,st){
  var cu=(st.custom&&st.custom[sub.id])||{},o={};
  CRIT.forEach(function(c){
    var v=cu[c.k];
    if(v===false)return;
    if(v&&v.max)o[c.k]=v; else if(sub.criteria[c.k])o[c.k]=sub.criteria[c.k];
  });
  return o;
}
function weightOf(sub,k){
  if(!sub.weights)return 1;
  var ks=Object.keys(sub.weights);
  if(sub.weights[k]!=null)return sub.weights[k];
  var sum=0;ks.forEach(function(x){sum+=sub.weights[x];});
  return ks.length?sum/ks.length:1;
}
/* كل معيار بيتحول لنسبة (حصل ÷ الكامل)، وبعدين متوسط النسب (بالتساوي أو بالأوزان المخصصة) */
function calc(sub,st){
  var eff=effCrit(sub,st),g=(st.grades&&st.grades[sub.id])||{},acc=0,sw=0,n=0,cnt=0;
  CRIT.forEach(function(c){
    var cr=eff[c.k]; if(!cr)return; cnt++;
    var v=g[c.k]; if(v===undefined||v===null||v==='')return;
    var w=weightOf(sub,c.k);
    acc+=Math.min(1,Math.max(0,v/cr.max))*w; sw+=w; n++;
  });
  return {pct:sw?acc/sw*100:null,entered:n,count:cnt};
}

/* الرقم القومي ← تاريخ الميلاد والنوع */
function parseNid(v){
  v=toEn(v).replace(/\s/g,'');
  if(!/^[23]\d{13}$/.test(v))return null;
  var y=(v[0]==='2'?1900:2000)+(+v.substr(1,2)),m=+v.substr(3,2),d=+v.substr(5,2);
  if(m<1||m>12||d<1||d>31)return null;
  return {birth:y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2),gender:(+v[12])%2?'m':'f'};
}

  });
  return map;
}

function subjectGradeCard(sub,st){
  var g=(st.grades&&st.grades[sub.id])||{},eff=effCrit(sub,st);
  var isCust=!!(st.custom&&st.custom[sub.id]&&Object.keys(st.custom[sub.id]).length);
  var tw=0;CRIT.forEach(function(c){if(eff[c.k])tw+=weightOf(sub,c.k);});
  var rows=CRIT.filter(function(c){return eff[c.k];}).map(function(c){
    var m=eff[c.k].max,v=g[c.k],bad=(v!==undefined&&v!==null&&v>m);
    var wl=sub.weights&&tw?'<em class="sx-w">وزن '+nf(weightOf(sub,c.k)/tw*100)+'٪</em>':'';
    return '<div class="sx-crit"><span>'+c.ic+' '+c.n+wl+'</span>'+
      '<input type="number" class="sx-grade'+(bad?' bad':'')+'" inputmode="decimal" min="0" max="'+m+'" step="any" data-sub="'+sub.id+'" data-k="'+c.k+'" placeholder="'+c.ph+'" value="'+(v===undefined||v===null?'':v)+'">'+
      '<small>من '+nf(m)+'</small><i class="sx-p">—</i></div>';
  }).join('');
  var panel='';
  if(S.cust===sub.id){
    var cu=(st.custom&&st.custom[sub.id])||{};
    panel='<div class="sx-cust"><p class="sx-hint">علّم على المعايير اللي تنطبق على <b>'+esc(st.name.split(' ')[0])+'</b> في المادة دي بس (مثلًا تدّيله فرصة بحث). باقي الدارسين مش هيتأثروا.</p>'+
      CRIT.map(function(c){
        var on=!!eff[c.k],mx=on?eff[c.k].max:DEF_MAX;
        return '<div class="sx-cr'+(on?' on':'')+'"><label><input type="checkbox" data-cc="'+c.k+'" data-sub="'+sub.id+'"'+(on?' checked':'')+'> '+c.ic+' '+c.n+'</label>'+
          '<span class="mx">'+c.maxLbl+' <input type="number" min="1" step="any" data-cm="'+c.k+'" data-sub="'+sub.id+'" value="'+mx+'"></span></div>';
      }).join('')+
      (Object.keys(cu).length?'<button class="btn sm" type="button" data-act="resetCust" data-sub="'+sub.id+'">↩︎ رجوع لمعايير المادة الأصلية</button>':'')+'</div>';
  }
  return '<div class="card sx-sc" data-sub="'+sub.id+'"><div class="sx-sc-head"><h4>'+esc(sub.name)+(isCust?' <span class="badge b-gold">مخصّص</span>':'')+'</h4>'+
    '<button class="btn sm" type="button" data-act="cust" data-sub="'+sub.id+'" title="معايير الدارس ده في المادة دي">⚙️ معايير</button></div>'+
    (rows||'<p class="sx-hint">مفيش معايير مختارة — اضغط ⚙️ معايير</p>')+panel+
    '<div class="sx-total"><div class="sx-total-top"><span>إجمالي المادة</span><b class="sx-pct">—</b></div>'+
    '<div class="sx-track"><div class="sx-fill"></div></div><div class="sx-note"></div></div></div>';
}
function refreshTotal(card){

}
function applyCust(st,sub,k,card){
  var chk=$('[data-cc='+k+']',card),mx=parseFloat($('[data-cm='+k+']',card).value)||DEF_MAX,def=sub.criteria[k];
  st.custom=st.custom||{};var m=st.custom[sub.id]=st.custom[sub.id]||{};
  if(chk.checked){ if(def&&def.max===mx)delete m[k]; else m[k]={max:mx}; }
  else{ if(def)m[k]=false; else delete m[k]; }
  if(!Object.keys(m).length)delete st.custom[sub.id];
  save();renderStudent(st.id);
}

    d.level=+lv.value;d.status=stt.value;d.gender=g?g.value:'';
    d.joinYear=d.joinYear?+d.joinYear:'';d.photo=photo;
    var target;
    if(id){target=getStudent(id);Object.assign(target,d);}
    else{d.id=uid();d.grades={};db.students.push(d);target=d;}
    if(!save())return;
    closeModal();toast('اتحفظت بيانات الدارس ✓');
    if(id)route();else go('student/'+d.id);
  });
}

/* ============================================================
   المواد
   ============================================================ */
function renderSubjects(){
  var lv=S.subjLevel;
  var chips=LEVELS.map(function(n,i){
    var c=db.subjects.filter(function(s){return s.level===i+1;}).length;
    return '<button type="button" class="tab'+(lv===i+1?' active':'')+'" data-slevel="'+(i+1)+'">'+n+' ('+nf(c)+')</button>';
  }).join('');
  var subs=db.subjects.filter(function(s){return s.level===lv;});
  var body=subs.length?'<div class="sx-list">'+subs.map(function(s){
    var tags=CRIT.filter(function(c){return s.criteria[c.k];}).map(function(c){
      return '<span class="badge b-blue">'+c.ic+' '+c.n+' · '+nf(s.criteria[c.k].max)+(s.weights?' · وزن '+nf(s.weights[c.k]||0)+'٪':'')+'</span>';}).join('');
    return '<div class="sx-subj"><div class="sx-grow"><div class="sx-name">'+esc(s.name)+'</div><div class="sx-tags">'+tags+'</div></div>'+
      '<div class="sx-acts"><button class="btn sm" type="button" data-act="editSub" data-id="'+s.id+'">✏️ تعديل</button><button class="btn sm danger" type="button" data-act="delSub" data-id="'+s.id+'">🗑 حذف</button></div></div>';
  }).join('')+'</div>':
  '<div class="sx-empty"><div class="big">📚</div><p>مفيش مواد في '+LEVELS[lv-1]+' لسه</p><button class="btn primary" type="button" data-act="newSub">➕ إضافة أول مادة</button></div>';
  view.innerHTML='<div class="sx-bar"><div class="tabs" style="margin:0;flex:1">'+chips+'</div><button class="btn primary" type="button" data-act="newSub">➕ مادة جديدة</button></div>'+
    '<p class="sx-hint" style="margin:0 4px 12px">المواد اللي بتضيفها هنا بتظهر تلقائي عند كل دارسين السنة دي، ولو عدّلت مادة التعديل بيوصل للكل وبتفضل الدرجات محفوظة.</p>'+body;
}
function openSubjectForm(id){
  var s=id?getSubject(id):{level:S.subjLevel,name:'',criteria:{},weights:null};
  var custom=!!s.weights;
  var rows=CRIT.map(function(c){
    var cr=s.criteria[c.k],on=!!cr;
    return '<div class="sx-cr'+(on?' on':'')+'"><label><input type="checkbox" data-ck="'+c.k+'"'+(on?' checked':'')+'> '+c.ic+' '+c.n+'</label>'+
      '<span class="mx">'+c.maxLbl+' <input type="number" min="1" step="any" data-mx="'+c.k+'" value="'+(cr?cr.max:(c.k==='att'?10:DEF_MAX))+'"></span>'+
      '<span class="wt">الوزن ٪ <input type="number" min="0" max="100" step="any" data-wt="'+c.k+'" value="'+(s.weights&&s.weights[c.k]!=null?s.weights[c.k]:'')+'"></span></div>';
  }).join('');
  openModal(
   '<div class="sx-mh"><h3>'+(id?'✏️ تعديل المادة':'➕ مادة جديدة')+'</h3><button class="sx-x" type="button" data-act="closeModal" aria-label="إغلاق">✕</button></div>'+
   '<form id="subForm" novalidate class="'+(custom?'wcustom':'')+'"><div class="sx-fg" style="margin-top:12px">'+
   '<div class="sx-f full"><label>اسم المادة / الكورس <span class="req">*</span></label><input type="text" data-f="name" value="'+esc(s.name)+'" placeholder="مثال: كتاب مقدس ١"></div>'+
   '<div class="sx-f full"><b>السنة</b>'+seg('level',[[1,'الأولى'],[2,'الثانية'],[3,'الثالثة']],s.level)+'</div></div>'+
   '<div class="sx-sec">✅ معايير التقييم</div><p class="sx-hint" style="margin:-4px 0 10px">علّم على المعايير الموجودة في المادة دي. في الحضور اكتب <b>عدد المحاضرات</b> (مثلًا ١٠) وعند كل دارس هتكتب حضر كام. باقي المعايير اكتب <b>الدرجة الكاملة</b>. كل معيار بيتحول لنسبة، والإجمالي هو متوسط النسب.</p>'+rows+
   '<div class="sx-sec">⚖️ توزيع الإجمالي</div>'+seg('wmode',[['eq','بالتساوي (الافتراضي)'],['custom','أوزان مخصصة']],custom?'custom':'eq')+
   '<div class="sx-wbox"><p class="sx-hint" style="margin:10px 0 6px">حدد وزن كل معيار من الإجمالي، والمجموع لازم يبقى ١٠٠٪.</p><div class="sx-wrow"><span id="wSum" class="badge b-gray"></span><button type="button" class="btn sm" id="wEq">⚖️ وزّع بالتساوي</button></div></div>'+
   '<div class="modal-actions"><button class="btn" type="button" data-act="closeModal">إلغاء</button><button class="btn primary" type="submit">💾 حفظ</button></div></form>'
  );
  var form=$('#subForm');
  function checked(){return CRIT.filter(function(c){return $('[data-ck='+c.k+']',form).checked;});}
  function sumW(){var t=0;checked().forEach(function(c){t+=parseFloat($('[data-wt='+c.k+']',form).value)||0;});return t;}
  function drawSum(){var t=sumW(),el=$('#wSum');el.textContent='المجموع '+nf(Math.round(t*100)/100)+'٪';el.className='badge '+(Math.abs(t-100)<=0.5?'b-green':'b-red');}
  function eq(){var c=checked();if(!c.length)return;var w=Math.round(10000/c.length)/100;c.forEach(function(x,i){$('[data-wt='+x.k+']',form).value=i===c.length-1?Math.round((100-w*(c.length-1))*100)/100:w;});drawSum();}
  if(custom)drawSum();
  form.addEventListener('change',function(e){
    var t=e.target;
    if(t.hasAttribute('data-ck')){t.closest('.sx-cr').classList.toggle('on',t.checked);if(form.classList.contains('wcustom'))eq();}
    if(t.name==='wmode'){var cu=t.value==='custom';form.classList.toggle('wcustom',cu);if(cu){var any=checked().some(function(c){return $('[data-wt='+c.k+']',form).value;});if(!any)eq();else drawSum();}}
  });
  form.addEventListener('input',function(e){if(e.target.hasAttribute('data-wt'))drawSum();});
  $('#wEq').addEventListener('click',eq);
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var name=$('[data-f=name]',form).value.trim(),lv=$('input[name=level]:checked',form),crit={},wts={};
    var cu=$('input[name=wmode]:checked',form).value==='custom';
    checked().forEach(function(c){
      var m=parseFloat($('[data-mx='+c.k+']',form).value);crit[c.k]={max:m>0?m:DEF_MAX};
      wts[c.k]=parseFloat($('[data-wt='+c.k+']',form).value)||0;
    });
    if(!name){toast('اكتب اسم المادة');return;}
    if(!Object.keys(crit).length){toast('اختار معيار تقييم واحد على الأقل');return;}
    if(cu){var t=0;Object.keys(wts).forEach(function(k){t+=wts[k];});if(Math.abs(t-100)>0.5){toast('مجموع الأوزان لازم يبقى ١٠٠٪ (دلوقتي '+nf(t)+'٪)');return;}}
    var level=lv?+lv.value:s.level,weights=cu?wts:null,sid;
    if(id){var o=getSubject(id);o.name=name;o.level=level;o.criteria=crit;o.weights=weights;sid=id;}
    else{sid=uid();db.subjects.push({id:sid,name:name,level:level,criteria:crit,weights:weights});}
    /* تنبيه لو درجات محفوظة بقت أكبر من الدرجة الكاملة الجديدة */
    var over=0;db.students.forEach(function(st){var g=st.grades&&st.grades[sid];if(!g)return;Object.keys(crit).forEach(function(k){if(g[k]!=null&&g[k]>crit[k].max)over++;});});
    S.subjLevel=level;if(!save())return;closeModal();
    toast(over?'اتحفظت — في '+nf(over)+' درجة أكبر من الدرجة الكاملة الجديدة، راجعها':'اتحفظت المادة ✓');route();
  });
}

/* ============================================================
   الأحداث
   ============================================================ */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-open],[data-flevel],[data-glevel],[data-slevel],[data-act],#sxNewStu');
  if(!t)return;
  if(t.id==='sxNewStu'){openStudentForm();return;}
  if(t.hasAttribute('data-open')){go('student/'+t.getAttribute('data-open'));return;}
  if(t.hasAttribute('data-flevel')){S.fLevel=+t.getAttribute('data-flevel');renderStudents();return;}
  if(t.hasAttribute('data-glevel')){S.gradeLevel=+t.getAttribute('data-glevel');S.cust=null;renderStudent(S._gradeFor);return;}
  if(t.hasAttribute('data-slevel')){S.subjLevel=+t.getAttribute('data-slevel');renderSubjects();return;}
  var a=t.getAttribute('data-act'),id=t.getAttribute('data-id'),sid=t.getAttribute('data-sub');
  if(a==='closeModal')closeModal();
  else if(a==='newStu')openStudentForm();
  else if(a==='editStu')openStudentForm(id);
  else if(a==='backStudents')go('students');
  else if(a==='goSubjects'){S.subjLevel=+t.getAttribute('data-level');go('subjects');}
  else if(a==='newSub')openSubjectForm();
  else if(a==='editSub')openSubjectForm(id);
  else if(a==='cust'){S.cust=(S.cust===sid?null:sid);renderStudent(S._gradeFor);}
  else if(a==='resetCust'){var st0=getStudent(S._gradeFor);if(st0&&st0.custom){delete st0.custom[sid];save();renderStudent(st0.id);}}
  else if(a==='delStu'){var st=getStudent(id);ask('حذف الدارس','هتتحذف بيانات «'+st.name+'» وكل درجاته نهائيًا.','🗑 حذف').then(function(ok){if(!ok)return;db.students=db.students.filter(function(s){return s.id!==id;});save();toast('اتحذف الدارس');go('students');});}
  else if(a==='delSub'){var sb=getSubject(id);ask('حذف المادة','هتتحذف «'+sb.name+'» ودرجاتها عند كل الدارسين.','🗑 حذف').then(function(ok){if(!ok)return;db.subjects=db.subjects.filter(function(s){return s.id!==id;});db.students.forEach(function(s){if(s.grades)delete s.grades[id];if(s.custom)delete s.custom[id];});save();toast('اتحذفت المادة');renderSubjects();});}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='sxQ'){S.q=t.value;drawStudentList();return;}
  if(!t.classList.contains('sx-grade'))return;
  var v=t.value,n=parseFloat(v),m=parseFloat(t.max);
  if(v!==''&&(isNaN(n)||n<0||n>m)){t.classList.add('bad');return;}
  t.classList.remove('bad');
  var st=getStudent(S._gradeFor);if(!st)return;
  st.grades=st.grades||{};var sid=t.getAttribute('data-sub');st.grades[sid]=st.grades[sid]||{};
  if(v==='')delete st.grades[sid][t.getAttribute('data-k')];else st.grades[sid][t.getAttribute('data-k')]=n;
  save();refreshTotal(t.closest('.sx-sc'));
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='sxJoin'){S.fJoin=t.value;drawStudentList();return;}
  if(t.hasAttribute&&(t.hasAttribute('data-cc')||t.hasAttribute('data-cm'))){
    var st=getStudent(S._gradeFor),sub=getSubject(t.getAttribute('data-sub'));
    if(st&&sub)applyCust(st,sub,t.getAttribute('data-cc')||t.getAttribute('data-cm'),t.closest('.sx-sc'));
    return;
  }
  if(!t.classList||!t.classList.contains('sx-grade')||t.value==='')return;
  var n=parseFloat(t.value),m=parseFloat(t.max);
  if(isNaN(n)||n<0||n>m){t.value=isNaN(n)||n<0?0:m;t.classList.remove('bad');t.dispatchEvent(new Event('input',{bubbles:true}));toast('الدرجة لازم تكون بين صفر و'+nf(m));}
});

route();
})();
</script>
