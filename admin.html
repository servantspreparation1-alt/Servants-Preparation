<script>

/* ============================================================
   إعداد الخدّام — سجل الدارسين (PWA)
   المبدأ الأهم: لا شيء يُحذف من السجل.
   كل سنة = محاولات (Attempts). إعادة السنة/المادة تنشئ محاولة
   جديدة برقم متزايد، والمحاولة القديمة تفضل محفوظة كما هي.
============================================================ */
const DB_KEY=E3.DB_KEY;
// ===== إصلاح البقاء ٧ أيام — Override جلسة ٧ أيام =====
const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
const SHORT_SESSION_MS = 12 * 60 * 60 * 1000;
(function(){
  try{
    if(window.E3){
      E3.SESSION_MS = SEVEN_DAYS_MS;
      E3.OWNER_SESSION_MS = SEVEN_DAYS_MS;
      E3.SESSION_REMEMBER_MS = SEVEN_DAYS_MS;
      if(!E3.store){
        E3.store={getItem:k=>localStorage.getItem(k), setItem:(k,v)=>localStorage.setItem(k,v), removeItem:k=>localStorage.removeItem(k)};
      }
    }
  }catch(e){}
})();
function touchSessionAdmin(){
  try{
    const rem=E3.store.getItem(SESSION_KEY+'_remember');
    if(rem==='0') return;
    const id=E3.store.getItem(SESSION_KEY);
    if(id) E3.store.setItem(SESSION_KEY+'_at', String(Date.now()));
  }catch(e){}
}
// تحديث تلقائي للجلسة مع كل تفاعل ( منزلقة 7 أيام من آخر حركة )
(function(){
  let last=0;
  function keep(){ const n=Date.now(); if(n-last<20000) return; last=n; touchSessionAdmin(); }
  ['click','keydown','touchstart','mousemove','scroll'].forEach(ev=> window.addEventListener(ev, keep, {passive:true}));
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') keep(); });
  setInterval(keep, 4*60*1000);
})();
// حماية كلمة السر: لا تسمح بالرجوع لصفحة الدخول بالـ Back إذا لسه مسجل
try{ history.replaceState({view: (typeof state!=='undefined'?state.view:'dashboard')}, '', location.href); }catch(e){}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* =====================================================================
   E3A v3 — طبقة توحيد بيانات الدخول
   • اسم المستخدم: مش بيفرّق بين كابيتال/سمول، ولا مسافات (حتى اللي في
     النص)، ولا همزات (أ إ آ ← ا)، ولا ة/ه ولا ى/ي، ولا أرقام عربي/إنجليزي،
     ولا الحروف المخفية (zero-width / RTL marks / tatweel).
   • كلمة السر: المسافات الزيادة من الأول والآخر بتتشال، والمسافات المتكررة
     بتتحول لمسافة واحدة — والحالة (كابيتال/سمول) بيفرّق فيها إلا لو الحساب
     مفعّل عليه «التسامح».
   • كل حساب ليه مفتاح ثابت (usernameKey) — البصمة بتتعمل بيه على طول،
     عشان نفس الكلمة تشتغل سواء اتكتبت في نموذج الإضافة أو إعادة التعيين.
   • التحقق بيجرّب المفاتيح القديمة كلها كمان، فالحسابات القديمة بتدخل زي ما هي.
   ===================================================================== */
var E3A = (function () {
  'use strict';

  var ZW = /[\u200B-\u200F\u202A-\u202E\u2060-\u2069\uFEFF]/g;
  var TATWEEL = /\u0640/g;
  var SPACES = /[\s\u2000-\u200A\u202F\u205F\u3000]+/g;

  function str(v) { return v == null ? '' : String(v); }
  function nfkc(t) { try { return t.normalize('NFKC'); } catch (e) { return t; } }
  function digits(t) {
    return t.replace(/[\u0660-\u0669]/g, function (c) { return String(c.charCodeAt(0) - 0x0660); })
            .replace(/[\u06F0-\u06F9]/g, function (c) { return String(c.charCodeAt(0) - 0x06F0); });
  }
  function clean(t) {
    return digits(nfkc(str(t)).replace(ZW, '').replace(TATWEEL, '').replace(/\u00A0/g, ' '));
  }

  /* مفتاح اسم المستخدم — كل الاختلافات الشكلية بتختفي هنا */
  function userKey(v) {
    return clean(v)
      .replace(/[\u064B-\u0652\u0670]/g, '')
      .toLowerCase()
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/[ىئ]/g, 'ي')
      .replace(/ة/g, 'ه')
      .replace(/ک/g, 'ك')
      .replace(/ی/g, 'ي')
      .replace(/ۀ/g, 'ه')
      .replace(SPACES, '');
  }

  /* الشكل اللي بيتخزن ويتشفّر بيه: من غير مسافات زيادة */
  function passCanon(v) {
    return clean(v).replace(/^[ \t]+/, '').replace(/[ \t]+$/, '').replace(/[ \t]+/g, ' ');
  }
  function passFold(v) { return passCanon(v).toLowerCase(); }

  function sameAsUser(pw, username) {
    var a = userKey(passCanon(pw)), b = userKey(username);
    return !!a && !!b && a === b;
  }

  /* الشكل اللي بيتعرض بيه اسم المستخدم في الجداول */
  function displayUsername(v) {
    return clean(v).replace(SPACES, ' ').replace(/^ +| +$/g, '');
  }

  /* كل المفاتيح المحتملة — للتوافق مع الحسابات القديمة */
  function salts(u) {
    var out = [], seen = {};
    function add(s) {
      s = str(s);
      if (!s || seen[s]) return;
      seen[s] = 1; out.push(s);
    }
    if (!u) return out;
    add(u.usernameKey);
    add(u.username);
    add(displayUsername(u.username));
    add(str(u.username).toLowerCase());
    add(str(u.username).trim().toLowerCase());
    add(userKey(u.username));

function subjFinal(sub){
 const scored=(sub.assessments||[]).filter(a=>a.score!==''&&a.score!=null&&!isNaN(+a.score));
 if(!scored.length) return null;
 const got=scored.reduce((s,a)=>s+(+a.score||0),0), max=scored.reduce((s,a)=>s+(+a.max||0),0);
 return max? Math.round(got/max*1000)/10 : null;
}
function subjStatus(sub){const f=subjFinal(sub); if(f==null)return null; return f>=DB.settings.passMark?'ناجح':'يحتاج إعادة'}
function enrollStats(en){
 const finals=(en.subjects||[]).map(subjFinal).filter(v=>v!=null);
 const subjAvg=finals.length? Math.round(finals.reduce((a,b)=>a+b,0)/finals.length*10)/10 : null;
 const acts=(en.activities||[]).filter(a=>a.score!==''&&a.score!=null&&a.max);
 const actAvg=acts.length? Math.round(acts.reduce((s,a)=>s+(+a.score/+a.max*100),0)/acts.length*10)/10 : null;
 let overall=subjAvg;
 if(subjAvg!=null&&actAvg!=null) overall=Math.round((subjAvg*0.8+actAvg*0.2)*10)/10;
 const att=(en.attendanceTotal>0)? Math.round(en.attendanceAttended/en.attendanceTotal*1000)/10 : null;
 const failed=(en.subjects||[]).filter(s=>subjStatus(s)==='يحتاج إعادة');
 return {subjAvg,actAvg,overall,att,failedCount:failed.length,failedNames:failed.map(s=>s.name),subjectsCount:(en.subjects||[]).length,doneSubjects:finals.length};
}

function filteredStudents(){
 const q=($('#fSearch')?.value||'').trim(), y=$('#fYear')?.value||'', fs=$('#fStatus')?.value||'', b=($('#fBatch')?.value||'').trim();
 return DB.students.filter(st=>{
  if(!canAccessStudent(st))return false;
  if(q && !(st.name.includes(q)||(st.code||'').includes(q)||(st.phone||'').includes(q)))return false;
  if(b && !(st.batch||'').includes(b))return false;
  if(y){const en=studentCurrent(st); if(!en||String(en.yearLevel)!==y)return false}
  if(fs==='risk')return isAtRisk(st);
  if(fs==='repeater')return (st.enrollments||[]).some(e=>e.attemptNo>1);
  if(fs)return st.status===fs;
  return true;
 });
}

/* ============================================================
   الحضور بالمحاضرات — كل محاضرة سجل مستقل، ونسبة الحضور في
   ملف الدارس بتتحدث تلقائياً، والغياب المتكرر = افتقاد.
============================================================ */
function sessionStudents(year){return DB.students.filter(st=>{if(!canAccessStudent(st))return false; const en=studentCurrent(st); return en&&en.yearLevel===year&&en.status==='ongoing'})}
function recalcEnrollmentAttendance(enrollmentId){
  DB.students.forEach(st=>{(st.enrollments||[]).forEach(en=>{ if(en.id!==enrollmentId)return;
    let total=0,att=0; (DB.attendanceSessions||[]).forEach(se=>{(se.records||[]).forEach(r=>{if(r.enrollmentId===enrollmentId){total++; if(r.status==='present'||r.status==='late')att++}})});
    if(total>0){en.attendanceTotal=(en._attBaseTotal||0)+total; en.attendanceAttended=(en._attBaseAttended||0)+att}
  })});
}
function recalcAllAttendance(){const ids=new Set(); (DB.attendanceSessions||[]).forEach(se=>(se.records||[]).forEach(r=>ids.add(r.enrollmentId))); ids.forEach(recalcEnrollmentAttendance)}
function attStatusLabel(v){return {present:'✅ حاضر',absent:'❌ غائب',late:'⏰ متأخر',excused:'📄 بعذر'}[v]||v}
function consecutiveAbsences(studentId,year){
  const sessions=(DB.attendanceSessions||[]).filter(se=>se.yearLevel===year).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); let count=0;
  for(const se of sessions){const r=(se.records||[]).find(x=>x.studentId===studentId); if(!r)continue; if(r.status==='absent')count++; else break}
  return count;
}

  ${repeated.length?`<div class="card" style="margin-bottom:14px;border-color:#f0b8b3"><h3>💗 غياب متكرر — دول أولى بالافتقاد والمكالمة</h3>${repeated.map(x=>{const en=studentCurrent(x.st);return `<div class="kv"><span><a href="#" onclick="go('profile','${x.st.id}');return false"><b>${esc(x.st.name)}</b></a> — غاب آخر <b>${x.n}</b> محاضرات ورا بعض</span><span style="display:flex;gap:6px;flex-wrap:wrap">${x.st.whatsapp||x.st.phone?`<a class="btn sm green" target="_blank" href="https://wa.me/${esc(String(x.st.whatsapp||x.st.phone).replace(/[^0-9]/g,'').replace(/^0/,'20'))}?text=${encodeURIComponent('أهلاً '+x.st.name+'، وحشتنا في إعداد الخدام ومفتقدينك. طمّنا عليك، ولو في أي حاجة معطّلاك إحنا جنبك ☦')}">💬 واتساب افتقاد</a>`:''}<button class="btn sm gold" onclick="quickFollowTask('${x.st.id}')">💗 مهمة متابعة</button></span></div>`}).join('')}</div>`:''}

    records.forEach(r=>{const st=getStudent(r.studentId); const en=st&&(st.enrollments||[]).find(e=>e.id===r.enrollmentId); if(en&&en._attBaseTotal===undefined){en._attBaseTotal=en.attendanceTotal||0; en._attBaseAttended=en.attendanceAttended||0}});

function downloadImportTemplate(){
  const csv='الاسم,الكود,الدفعة,تاريخ الالتحاق,الهاتف,واتساب,النوع,تاريخ الميلاد,الكنيسة,أب الاعتراف,المؤهل\nأحمد سمير,D-101,دفعة 2026,2026-10-01,01001234567,01001234567,ذكر,2002-05-10,,أبونا داود,طالب جامعي\n';
  download(new Blob(['\ufeff'+csv],{type:'text/csv'}),'نموذج-استيراد-الدارسين.csv'); toast('نزل النموذج — عبّيه في Excel وارفعه CSV أو xlsx');

function importStudentsCSV(text){
  const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2)return toast('الملف فاضي أو بدون صفوف');
  const head=lines[0].split(',').map(h=>h.trim());
  const idx=(names)=>{for(const n of names){const i=head.indexOf(n); if(i>=0)return i} return -1};
  const I={name:idx(['الاسم','name','اسم الدارس']),code:idx(['الكود','code']),batch:idx(['الدفعة','batch']),join:idx(['تاريخ الالتحاق','joinDate']),phone:idx(['الهاتف','phone','الموبايل']),whats:idx(['واتساب','whatsapp']),gender:idx(['النوع','gender']),birth:idx(['تاريخ الميلاد','birthDate']),church:idx(['الكنيسة','church']),father:idx(['أب الاعتراف','confessionFather']),edu:idx(['المؤهل','education','الوظيفة'])};
  if(I.name<0)return toast('لازم يكون في عمود «الاسم» في أول صف');
  let added=0,skipped=0;
  lines.slice(1).forEach(line=>{const c=line.split(',').map(x=>x.trim()); const name=c[I.name]; if(!name){skipped++;return}
    const code=I.code>=0&&c[I.code]?c[I.code]:('D-'+String(DB.students.length+added+1).padStart(3,'0'));
    if(DB.students.some(st=>st.code===code)){skipped++;return}
    DB.students.push({id:uid(),code,name,batch:I.batch>=0?c[I.batch]:'',joinDate:I.join>=0?c[I.join]:today(),phone:I.phone>=0?c[I.phone]:'',whatsapp:I.whats>=0?c[I.whats]:'',gender:I.gender>=0?c[I.gender]:'',birthDate:I.birth>=0?c[I.birth]:'',email:'',nationalId:'',address:'',education:I.edu>=0?c[I.edu]:'',church:I.church>=0?c[I.church]:'',confessionFather:I.father>=0?c[I.father]:'',status:'active',fixedNotes:'',photo:'',createdAt:today(),updatedAt:today(),enrollments:[],notes:[]}); added++;
  });
  logActivity('استورد '+added+' دارس من ملف CSV'); saveDB(); render(); toast('تم استيراد '+added+' دارس ✅'+(skipped?' (اتخطى '+skipped+' صف: فاضي أو كود مكرر)':''));
}

async function studioSavePdf(){
  const paper=document.getElementById('docStudioPaper');
  if(!paper||!paper.innerHTML.trim()) return toast('مفيش مستند');
  try{
    toast('جاري تجهيز PDF من التصميم…');
    if(!window.html2canvas||!(window.jspdf||window.jsPDF)){
      // fallback: download HTML
      download(new Blob(['<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>'+_studioMeta.title+'</title></head><body>'+paper.innerHTML+'</body></html>'],{type:'text/html'}),( _studioMeta.filename||'document')+'.html');
      return toast('اتحفظ كملف HTML — افتحه واحفظ PDF لو المكتبات مش محمّلة');
    }
    const canvas=await html2canvas(paper,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
    const { jsPDF } = window.jspdf||window;
    const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
    const img=canvas.toDataURL('image/jpeg',0.92);
    const pageW=210, pageH=297, margin=8;
    const w=pageW-margin*2;
    const h=canvas.height*(w/canvas.width);
    let y=margin, remaining=h, srcY=0;
    const pageCanvasH=canvas.width*((pageH-margin*2)/w);
    if(h<=pageH-margin*2){
      pdf.addImage(img,'JPEG',margin,margin,w,h);
    }else{
      let offset=0, first=true;
      while(offset<canvas.height){
        const sliceH=Math.min(pageCanvasH, canvas.height-offset);
        const c=document.createElement('canvas');
        c.width=canvas.width; c.height=sliceH;
        c.getContext('2d').drawImage(canvas,0,offset,canvas.width,sliceH,0,0,canvas.width,sliceH);
        if(!first) pdf.addPage();
        first=false;
        const sh=sliceH*(w/canvas.width);
        pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',margin,margin,w,sh);
        offset+=sliceH;
      }
    }
    pdf.save((_studioMeta.filename||'document')+'.pdf'); logActivity('صدّر PDF: '+(_studioMeta.filename||'document')); saveDB();
    toast('تم حفظ PDF ✅');
  }catch(e){ console.error(e); toast('تعذّر إنشاء PDF — جرّب تاني'); }
}

/* ---------- النوافذ (Modals) ---------- */
function askConfirm(opts){
  const o=typeof opts==='string'?{message:opts}: (opts||{});
  return new Promise(resolve=>{
    const bg=document.getElementById('confirmBg');
    if(!bg){ resolve(!!window.confirm(o.message||'')); return; }
    document.getElementById('confirmTitle').textContent=o.title||'تأكيد العملية';
    document.getElementById('confirmMsg').innerHTML=o.message||'متأكد؟';
    document.getElementById('confirmIcon').textContent=o.icon||(o.danger?'🗑️':'⚠️');
    document.getElementById('confirmExtra').innerHTML=o.extraHTML||'';
    const okBtn=document.getElementById('confirmOk');
    const cancelBtn=document.getElementById('confirmCancel');
    okBtn.textContent=o.ok||'نعم، متأكد';
    cancelBtn.textContent=o.cancel||'إلغاء';
    bg.querySelector('.app-confirm').classList.toggle('danger', !!o.danger);
    okBtn.className='btn '+(o.danger?'danger':'primary');
    bg.hidden=false;
    const finish=v=>{ bg.hidden=true; resolve(v); };
    okBtn.onclick=()=>{
      const extra=document.getElementById('confirmField');
      if(o.requireField){
        const val=(extra&&extra.value||'').trim();
        if(!val){ toast('اكتب التأكيد المطلوب'); return; }
        finish(val); return;
      }
      finish(true);
    };
    cancelBtn.onclick=()=>finish(false);
  });
}

window.addEventListener('popstate', (e)=>{
  try{
    // لو الجلسة انتهت — اطلع للدخول

    if(e.state && e.state.view){
      state.view = e.state.view;

      render();
      return;
    }
    // لو مفيش state (مثلاً رجوع من صفحة دخول قديمة) — نمنع الخروج للدخول ونفضل في التطبيق
    if(currentUser()){

      }
    }
  }catch(err){}
});

// سحب من الحافة الشمال لليمين — يعمل زي زرار الرجوع (iPhone/Android)
(function enableSwipeBack(){
  let startX=0, startY=0, tracking=false, hintEl=null;
  const EDGE=36, THRESH=70;
  try{
    // عنصر بصري يظهر أثناء السحب
    const s=document.createElement('style');
    s.textContent=`html{ overscroll-behavior-x: contain; } body{ overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
    .swipe-glow{ position:fixed; top:0; bottom:0; right:0; width:5px; background: linear-gradient(180deg, #c9a227, #8a6410); opacity:0; transition: opacity .2s; z-index:9998; pointer-events:none; }
    .swipe-glow.on{ opacity:.85; }
    .swipe-hint-bubble{ position:fixed; top:50%; right:12px; transform:translateY(-50%) scale(.8); background: rgba(18,50,92,.92); color:#fff8e8; font-size:22px; padding:10px 12px; border-radius:24px; box-shadow:0 6px 18px rgba(0,0,0,.28); opacity:0; transition: all .2s; z-index:9999; pointer-events:none; }
    .swipe-hint-bubble.on{ opacity:1; transform:translateY(-50%) scale(1); }
    @media (pointer:fine){ .swipe-glow, .swipe-hint-bubble{ display:none; } }`;
    document.head.appendChild(s);
    const glow=document.createElement('div'); glow.className='swipe-glow'; document.body.appendChild(glow); hintEl=glow;
    const bubble=document.createElement('div'); bubble.className='swipe-hint-bubble'; bubble.textContent='‹ رجوع'; document.body.appendChild(bubble);

    function onStart(e){
      const t=e.touches[0]; if(!t) return;
      // فقط من الحافة اليمين في RTL (الشمال بصرياً في LTR لكن الصفحة RTL — الحافة اليمنى هي الشمال المنطقي للمستخدم؟)
      // المستخدم قال: "من ناحية الشمال وأجيبها يمين" — في RTL الشمال بصرياً هو اليسار الفعلي.
      // ندعم الحافتين للتسهيل: لو RTL نستقبل من اليمين أيضاً
      const isRTL = document.documentElement.dir==='rtl';
      const fromEdge = isRTL ? (window.innerWidth - t.clientX <= EDGE) : (t.clientX <= EDGE);
      // ندعم الحافتين معاً لتجربة أفضل على الآيفون
      const anyEdge = (t.clientX <= EDGE) || (window.innerWidth - t.clientX <= EDGE);
      if(anyEdge){
        startX=t.clientX; startY=t.clientY; tracking=true;
        glow.classList.add('on'); bubble.classList.add('on');
      } else tracking=false;
    }
    function onMove(e){
      if(!tracking) return;
      const t=e.touches[0]; if(!t) return;
      const dx = t.clientX - startX;
      const adx = Math.abs(dx);
      const dy = Math.abs(t.clientY - startY);
      // في RTL السحب من اليمين لليسار هو الرجوع، نحولها لقيمة موجبة
      const isRTL = document.documentElement.dir==='rtl';
      let effectiveDx = dx;
      if(isRTL && startX > window.innerWidth/2) effectiveDx = -(dx); // من اليمين: الحركة لليسار تعتبر رجوع
      if(adx>12 && dy<90){
        const prog = Math.min(.85, adx/110);
        glow.style.opacity = prog;
        bubble.style.opacity = prog;
      }
    }
    function onEnd(e){
      if(!tracking) return; tracking=false; glow.classList.remove('on'); bubble.classList.remove('on'); glow.style.opacity=''; bubble.style.opacity='';
      const t=e.changedTouches[0]; if(!t) return;
      const dx = t.clientX - startX;
      const dy = Math.abs(t.clientY - startY);
      const isRTL = document.documentElement.dir==='rtl';
      // تحديد اتجاه الرجوع حسب الحافة
      let shouldBack=false;
      if(startX <= EDGE){
        // من اليسار لليمين
        shouldBack = (dx > THRESH && dy < 110);
      }else{
        // من اليمين لليسار (في RTL)
        shouldBack = (dx < -THRESH && dy < 110);
      }
      if(shouldBack){
        if(navigator.vibrate) navigator.vibrate(18);
        // لو في history داخل التطبيق — استخدم history.back، وإلا ارجع للداشبورد
        if(history.state && history.state.view){
          history.back();
        }else if(state.view!=='dashboard'){
          go('dashboard');
        }else{
          // في الداشبورد — اهتزاز خفيف فقط
          if(navigator.vibrate) navigator.vibrate([30,40,30]);
        }
      }
    }
    document.addEventListener('touchstart', onStart, {passive:true});
    document.addEventListener('touchmove', onMove, {passive:true});
    document.addEventListener('touchend', onEnd, {passive:true});
  }catch(e){}
})();

// تحسينات راحة إضافية للموبايل والويب
(function mobileUX(){
  try{
    // تحسين الـ viewport للآيفون مع النوتش
    const vv = document.querySelector('meta[name="viewport"]');
    if(vv && !vv.content.includes('viewport-fit')){
      vv.content += ', viewport-fit=cover';
    }
    // منع التحديد المزعج أثناء السحب
    document.documentElement.style.webkitTouchCallout='none';
    // تحسين التمرير السلس
    document.documentElement.style.scrollBehavior='smooth';
    // إصلاح اهتزاز الـ overscroll على iOS
    document.body.style.overscrollBehavior='contain';
  }catch(e){}

  // اختصار لوحة المفاتيح للويب: ESC يقفل المودال
  window.addEventListener('keydown', (e)=>{
    if(e.key==='Escape'){
      const bg=document.getElementById('modalBg');

      else if(typeof toggleSidebar==='function'){ toggleSidebar(false); }
    }
  });

  // مؤشر أونلاين/أوفلاين أوضح

})();
