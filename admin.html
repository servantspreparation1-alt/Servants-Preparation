<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إعداد الخدّام — سجل الدارسين</title>
<meta name="description" content="نظام متابعة دارسي إعداد الخدام عبر ٣ سنوات مع حفظ كل المحاولات والتقارير">
<meta name="theme-color" content="#2b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إعداد الخدام">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--wine:#70162b;--wine2:#4a1025;--gold:#c9a227;--gold2:#e8c55a;--navy:#1d2a4d;--dark:#2b1020;--green:#2e7d4f;--green-bg:#e2f2e6;--amber:#b7791f;--amber-bg:#fdf0cd;--red:#b3261e;--red-bg:#fbe3e0;--purple:#7b3f8c;--bg:#faf6ee;--card:#fffdf8;--line:#e8dcc3;--text:#33262e;--muted:#8a7663;--radius:16px;--shadow:0 8px 28px rgba(75,32,20,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--wine)}
/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:252px;background:linear-gradient(180deg,#33122c 0%,#40182c 55%,#1d2340 130%);color:#f3e7cf;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;z-index:40;border-inline-end:3px solid var(--gold)}
.logo{display:flex;gap:11px;align-items:center;padding:4px 6px 16px;border-bottom:1px solid rgba(201,162,39,.35);margin-bottom:14px}
.logo-icon{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);background:rgba(201,162,39,.14);color:var(--gold2);display:grid;place-items:center;font-size:23px;flex-shrink:0;overflow:hidden}
.logo-icon img{width:100%;height:100%;object-fit:cover}
.logo b{font-size:17px;display:block;color:#fff}.logo span{font-size:11px;color:#d8c69a}
.nav-label{font-size:11px;color:#c9a86a;margin:15px 8px 6px;letter-spacing:.3px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#f0e4c8;text-decoration:none;margin-bottom:3px;font-size:14px;border:0;background:none;width:100%;text-align:right}
.nav-item:hover{background:rgba(201,162,39,.16);color:#fff}.nav-item.active{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#2b1020;font-weight:800;box-shadow:0 4px 14px rgba(201,162,39,.35)}
.nav-item .ic{width:20px;text-align:center}
.side-user{margin-top:18px;background:rgba(255,248,230,.09);border:1px solid rgba(201,162,39,.4);border-radius:14px;padding:11px;display:flex;gap:9px;align-items:center}
.side-user small{color:#d8c69a!important}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--wine),var(--wine2));border:2px solid var(--gold);color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.main{flex:1;padding:24px;min-width:0;background:radial-gradient(1000px 400px at 80% -5%,rgba(201,162,39,.12),transparent 60%),var(--bg)}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{margin:0;font-size:25px;color:var(--wine2)}.topbar p{margin:3px 0 0;color:var(--muted);font-size:13px}
.searchbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.searchbox input,.searchbox select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;outline:none;color:var(--text)}
.searchbox input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.22)}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 16px;border-radius:11px;font-weight:700;font-size:13px;display:inline-flex;gap:7px;align-items:center;justify-content:center;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(75,32,20,.10)}
.btn.primary{background:linear-gradient(135deg,var(--wine),var(--wine2));border-color:var(--wine2);color:#fff}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:var(--gold);color:#2b1020}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:#fff;border-color:#efb3ae;color:var(--red)}.btn.ghost{border-color:transparent;background:transparent;color:var(--wine)}.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}

/* ===== زر التثبيت — هوية النظام ===== */
.install-btn{display:flex;align-items:center;gap:11px;width:100%;padding:12px 14px;border-radius:15px;border:1.5px solid var(--gold2);background:linear-gradient(135deg,var(--gold),var(--gold2) 55%,#f3d97e);color:#2b1020;font-weight:900;font-size:14.5px;box-shadow:0 10px 22px rgba(201,162,39,.35),inset 0 1px 0 rgba(255,255,255,.65);transition:.18s;text-align:right;position:relative;overflow:hidden}
.install-btn:hover{transform:translateY(-2px);box-shadow:0 16px 30px rgba(201,162,39,.45),inset 0 1px 0 rgba(255,255,255,.7)}
.install-btn:active{transform:translateY(0)}
.install-btn .install-ic{width:38px;height:38px;border-radius:50%;background:var(--wine2);color:var(--gold2);display:grid;place-items:center;font-size:19px;flex-shrink:0;box-shadow:inset 0 0 0 2px rgba(232,197,90,.5)}
.install-btn b{display:block;font-size:14.5px}.install-btn small{display:block;font-weight:700;font-size:11px;opacity:.75;margin-top:1px}
.install-btn .go{margin-inline-start:auto;font-size:20px;opacity:.65}
.install-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 48%,transparent 62%);transform:translateX(120%);transition:.6s;pointer-events:none}
.install-btn:hover::after{transform:translateX(-120%)}
/* ===== حسابي — بروفايل معاد تصميمه ===== */
.acct-hero{background:linear-gradient(130deg,var(--wine2),var(--wine) 60%,#8a6d1c);border:1.5px solid var(--gold);border-radius:18px;padding:20px;color:#fdf6df;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.acct-photo-wrap{position:relative;flex-shrink:0}
.acct-photo{width:96px;height:96px;border-radius:26px;border:3px solid var(--gold2);background:rgba(255,248,230,.12);display:grid;place-items:center;font-size:38px;font-weight:900;color:#fff;overflow:hidden}
.acct-photo img{width:100%;height:100%;object-fit:cover}
.cam-btn{position:absolute;bottom:-7px;inset-inline-end:-7px;width:34px;height:34px;border-radius:50%;border:2.5px solid #fff8e8;background:var(--gold);color:#2b1020;display:grid;place-items:center;font-size:15px;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.cam-btn:hover{transform:scale(1.08)}
.acct-hero h3{color:#fff;margin:0;font-size:20px}.acct-hero .sub2{font-size:12.5px;opacity:.85;margin-top:2px}
.acct-sec{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 16px;margin-bottom:13px}
.acct-sec h4{margin:0 0 11px;font-size:13.5px;color:var(--wine2);display:flex;align-items:center;gap:7px}
.pw-wrap{display:flex;gap:7px}.pw-wrap input{flex:1}
.pw-meter{height:7px;background:#f1e9d8;border-radius:99px;overflow:hidden;margin-top:7px}.pw-meter i{display:block;height:100%;width:0;border-radius:99px;transition:.25s}
.file-input{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}
.upload-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:10px 15px;border-radius:11px;border:1px solid var(--gold);background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2b1020;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 6px 16px rgba(201,162,39,.25);touch-action:manipulation}
.upload-btn:active{transform:scale(.98)}
.file-name{font-size:11px;color:var(--muted);margin-top:5px;word-break:break-word}
.table-scroll{overflow-x:auto;max-width:100%;border-radius:12px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.table-scroll table{min-width:720px}
.sidebar-backdrop{display:none}
.sidebar-close{display:none}
.mobile-nav{display:none}
body.no-scroll{overflow:hidden}
.user-chip{display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;box-shadow:var(--shadow)}
[dir=rtl] .user-chip{padding:5px 6px 5px 12px}
/* ===== Auth / Login ===== */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.02fr .98fr;background:var(--bg)}
.auth-art{position:relative;background:url('images/login-church.jpg') center/cover no-repeat;min-height:300px}
.auth-art:before{content:"";position:absolute;inset:0;background:linear-gradient(200deg,rgba(43,16,32,.08) 40%,rgba(43,16,32,.88))}
.auth-art-content{position:absolute;inset-inline:0;bottom:0;padding:34px;color:#fdf6df;z-index:1}
.auth-art-content .verse{font-size:clamp(18px,2.4vw,27px);line-height:1.9;font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.auth-art-content .ref{color:var(--gold2);font-size:13px;margin-top:6px}
.auth-side{display:flex;align-items:center;justify-content:center;padding:28px 18px;background:radial-gradient(700px 350px at 50% 0%,rgba(201,162,39,.16),transparent 65%),var(--bg)}
.login-card{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:22px;padding:30px 28px;box-shadow:0 24px 60px rgba(75,32,20,.16)}
.login-logo{width:118px;height:118px;margin:0 auto 10px;border-radius:50%;border:2.5px dashed var(--gold);background:#fff8e8;display:grid;place-items:center;font-size:52px;color:var(--wine);overflow:hidden}
.login-logo img{width:100%;height:100%;object-fit:cover}
.login-card h1{margin:6px 0 2px;text-align:center;font-size:24px;color:var(--wine2)}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);margin:16px 0}.orn:before,.orn:after{content:"";height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);flex:1}
.login-card .field{margin-bottom:13px}.login-card .field input{padding:13px 14px;font-size:15px}
.login-error{display:none;background:var(--red-bg);color:var(--red);border:1px solid #f0b8b3;padding:10px 13px;border-radius:11px;font-size:13px;margin-bottom:13px;font-weight:700}
.login-error.show{display:block;animation:shake .3s}
@keyframes shake{25%{transform:translateX(4px)}75%{transform:translateX(-4px)}}
.only-servants{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;color:var(--muted);margin-top:14px;background:#fdf6df;border:1px dashed var(--gold);border-radius:10px;padding:8px}
/* ===== Cards & stats ===== */
.grid{display:grid;gap:14px}.grid.c4{grid-template-columns:repeat(4,1fr)}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat b{font-size:28px;display:block;color:var(--wine2)}.stat span{color:var(--muted);font-size:13px}.stat .trend{color:var(--green);font-size:12px;font-weight:700;margin-top:6px}
.stat .icbox{float:left;width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#fdf0cd,#f7e3a1);border:1px solid var(--gold);display:grid;place-items:center;font-size:20px}
h2.sec{font-size:17px;margin:22px 0 10px;color:var(--wine2)}h3{margin:0 0 10px;font-size:15px;color:var(--wine2)}
/* ===== Badges ===== */
.badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.b-green{background:var(--green-bg);color:var(--green)}.b-red{background:var(--red-bg);color:var(--red)}.b-amber{background:var(--amber-bg);color:var(--amber)}.b-blue{background:#dfe7fa;color:var(--navy)}.b-gray{background:#f1e9d8;color:#7a6748}.b-purple{background:#f1e3f5;color:var(--purple)}.b-gold{background:#fdf0cd;color:#8a6410;border:1px solid var(--gold)}
.grade{display:inline-grid;place-items:center;min-width:58px;padding:7px 10px;border-radius:9px;background:#35a05c;color:#fff;font-weight:900;font-size:15px}
.grade.mid{background:#e39a13}.grade.low{background:#4a6fb5}.grade.fail{background:#d84a41}
/* ===== Students & users ===== */
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.student-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.student-card:hover{transform:translateY(-2px);border-color:var(--gold)}
.student-head{display:flex;gap:12px;align-items:center}
.student-head .avatar{width:56px;height:56px;font-size:20px}
.student-head b{font-size:16px}.student-head small{color:var(--muted);display:block}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}.kv span{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:#fbf3dd;color:#7a5a10;text-align:right;padding:10px;border-bottom:1px solid var(--line);font-size:12px}td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}tr:hover td{background:#fffaf0}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;background:#fffaf0;border:1px solid var(--line);border-radius:12px;padding:13px}
.perm-grid label{font-size:13px;display:flex;gap:7px;align-items:center}
.role-card{border:1.5px solid var(--line);border-radius:14px;padding:15px;background:#fff}
.role-card.top{border-color:var(--gold);background:linear-gradient(180deg,#fff8e8,#fffdf8)}
.roles-hint{display:none}.role-title{display:flex;gap:9px;align-items:center}.role-details{margin-top:8px}.role-details summary{cursor:pointer;font-weight:900;color:var(--wine);font-size:13px;padding:5px 0}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
/* ===== Profile ===== */
.profile-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.profile-hero .avatar{width:92px;height:92px;font-size:32px;border-radius:22px}
.attempt{border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:var(--card)}
.attempt.current{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.20)}
.attempt.old{background:#fdfaf3}
.subj{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.subj-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.progress{height:9px;background:#f1e9d8;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);border-radius:99px}
.progress i.mid{background:#e39a13}.progress i.fail{background:#d84a41}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:18px 0 14px;overflow:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
.tab.active{color:var(--wine);border-color:var(--gold)}
.note{border-inline-start:4px solid var(--gold);background:#fffaf0;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.note.conf{border-color:var(--purple);background:#fbf5fd}
.timeline{position:relative;padding-inline-start:22px}.timeline:before{content:"";position:absolute;inset-inline-start:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:14px}.tl-item:before{content:"";position:absolute;inset-inline-start:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
/* ===== Modal / forms ===== */
.modal-bg{position:fixed;inset:0;background:rgba(43,16,32,.62);display:none;place-items:start center;z-index:100;overflow:auto;padding:18px 10px}
.modal-bg.open{display:grid}
.modal{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:18px;width:min(760px,100%);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(980px,100%)}
.modal h2{margin:0 0 4px;font-size:19px;color:var(--wine2)}.modal .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#6d5636}
.field textarea{min-height:78px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
.photo-up{display:flex;gap:12px;align-items:center}.photo-up .avatar{width:64px;height:64px;font-size:22px;border-radius:16px}
/* ===== Report / print ===== */
.report-paper{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:var(--shadow)}
.report-head{background:linear-gradient(135deg,var(--wine2),var(--wine));color:#fdf6df;border:2px solid var(--gold);border-radius:12px;padding:20px;text-align:center;margin-bottom:18px}
.report-head h2{margin:0;font-size:22px;color:#fdf6df}.report-head p{margin:4px 0 0;opacity:.88;font-size:13px}
#printArea{display:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.filters .field{min-width:150px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty .big{font-size:38px}
.toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--wine2);color:#fdf6df;border:1px solid var(--gold);padding:12px 18px;border-radius:12px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.3);display:none;font-size:14px}
.offline-bar{display:none;background:#7c2d12;color:#fff;text-align:center;padding:7px;font-size:13px;position:relative;z-index:5}
.offline-bar.show{display:block}
.hamburger{display:none}
@media(max-width:900px){
 .sidebar{position:fixed;inset-inline-start:0;top:0;transform:translateX(-110%);transition:transform .24s ease;width:min(84vw,300px);height:100dvh;box-shadow:0 0 40px rgba(0,0,0,.35);z-index:80;padding-top:max(18px,env(safe-area-inset-top))}
 [dir=rtl] .sidebar{transform:translateX(110%)}
 .sidebar.open{transform:none!important}
 .sidebar-close{display:grid;place-items:center;position:absolute;top:max(12px,env(safe-area-inset-top));inset-inline-end:12px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(232,197,90,.65);background:rgba(255,248,230,.10);color:#fff;font-size:24px;line-height:1;z-index:2}
 .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(30,8,20,.58);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .22s;z-index:70}
 .sidebar-backdrop.show{opacity:1;pointer-events:auto}
 .main{padding:14px 14px calc(92px + env(safe-area-inset-bottom));width:100%}
 .grid.c4,.grid.c3{grid-template-columns:1fr 1fr}.form-grid,.perm-grid{grid-template-columns:1fr}.hamburger{display:inline-flex}
 .auth-wrap{grid-template-columns:1fr}.auth-art{min-height:230px}.auth-art-content{padding:20px}.auth-side{padding:16px 12px 26px}
}
@media(max-width:560px){.grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.c3,.grid.c2{grid-template-columns:minmax(0,1fr)}.grid>*,.student-grid>*{min-width:0}.card,.role-card{max-width:100%;overflow-wrap:anywhere}.card .btn{max-width:100%}#view select{max-width:100%}}
@media print{
 body{background:#fff}.sidebar,.topbar,.no-print,.toast,.modal-bg,.auth-wrap,.offline-bar,#view{display:none!important}
 .main{padding:0}.app{display:block}
 #printArea{display:block!important}
 .report-paper{border:0;box-shadow:none;padding:0}
 table{font-size:11px}th,td{padding:6px}
 @page{margin:12mm}
}

/* ===== Mobile polish: لمس أسهل، سرعة، وترتيب أوضح ===== */
.mobile-nav button{font-family:inherit}
@media(max-width:900px){
  html{-webkit-text-size-adjust:100%}
  body{font-size:15px;overscroll-behavior-y:none}
  button,.btn,.nav-item,.tab{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .btn{min-height:44px;padding:10px 15px}
  .btn.sm{min-height:38px;padding:8px 11px}
  .nav-item{min-height:46px;padding:11px 12px;margin-bottom:4px}

<script>
/* ============================================================
   إعداد الخدّام — سجل الدارسين (PWA)
   المبدأ الأهم: لا شيء يُحذف من السجل.
   كل سنة = محاولات (Attempts). إعادة السنة/المادة تنشئ محاولة
   جديدة برقم متزايد، والمحاولة القديمة تفضل محفوظة كما هي.
============================================================ */
const DB_KEY='e3dad_khoddam_db_v1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=> 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=> new Date().toISOString().slice(0,10);
const YEAR_NAMES={1:'السنة الأولى',2:'السنة الثانية',3:'السنة الثالثة'};
const ATTEMPT_STATUS={ongoing:'جارية',completed:'مكتملة',passed:'ناجح / منتقل',repeat_year:'إعادة سنة',repeat_courses:'إعادة مواد',paused:'موقوفة مؤقتاً',withdrawn:'منسحب'};
let deferredPrompt=null;

let DB = loadDB();
let state = {view:'dashboard', studentId:null, profileTab:'years', yearFilter:1, reportStudentAttempt:'all', attYear:1};

function defaultSettings(){return{orgName:'إعداد الخدّام',church:'',orgLogo:'',passMark:60,excellentMark:90,attendanceWarn:75,serviceHoursTarget:100,spiritualMeetingsTarget:10}}
function defaultTemplates(){return{
 1:[['الكتاب المقدس — مدخل ودراسة','كتاب مقدس'],['العقيدة ١','عقيدة'],['تاريخ الكنيسة ١','تاريخ كنيسة'],['الطقس ١','طقس'],['روحيات الخادم','روحي'],['علم النفس ومراحل النمو','تربوي / نفسي'],['التربية الكنسية ١','تربوي'],['مهارات التواصل','مهارات']],
 2:[['الكتاب المقدس ٢','كتاب مقدس'],['العقيدة ٢','عقيدة'],['تاريخ الكنيسة ٢','تاريخ كنيسة'],['الطقس ٢','طقس'],['التعامل مع المشكلات واتخاذ القرار','مهارات'],['التدريب العملي ١','تدريب عملي'],['إعداد الدرس ووسائل الإيضاح','تربوي'],['خدمة المراحل المختلفة','خدمة']],
 3:[['دراسات كتابية متقدمة','كتاب مقدس'],['دفاعيات وقضايا معاصرة','عقيدة / دفاعيات'],['قيادة وإدارة الخدمة','مهارات'],['الإرشاد الأسري والنفسي','تربوي / نفسي'],['التدريب العملي ٢','تدريب عملي'],['مشروع التخرج','مشروع تخرج'],['كرازة وخدمة خارجية','خدمة'],['خلوات ومؤتمرات إعداد الخدام','روحي']]
}}
function defaultAssessments(){return[
 {id:uid(),title:'الحضور والمشاركة',type:'حضور',date:'',score:'',max:10},
 {id:uid(),title:'واجبات وأبحاث',type:'واجب / بحث',date:'',score:'',max:20},
 {id:uid(),title:'اختبار نصف الفترة',type:'اختبار',date:'',score:'',max:20},
 {id:uid(),title:'الاختبار النهائي',type:'امتحان نهائي',date:'',score:'',max:50}
]}
function loadDB(){
 try{const raw=localStorage.getItem(DB_KEY); if(raw){const d=JSON.parse(raw); d.settings={...defaultSettings(),...(d.settings||{})}; d.users=d.users||[]; d.activityLog=d.activityLog||[]; d.attendanceSessions=d.attendanceSessions||[]; d.tasks=d.tasks||[]; return d;}}catch(e){}
 return {students:[], users:[], activityLog:[], attendanceSessions:[], tasks:[], templates:defaultTemplates(), settings:defaultSettings(), seeded:false};
}
function saveDB(){localStorage.setItem(DB_KEY, JSON.stringify(DB)); if(window.E3Cloud)E3Cloud.queuePush();}

/* ============================================================
   الدخول والصلاحيات — للخدام فقط
   ال Pseudohierarchy مبنية على دليل تنظيم الخدمة بالكنيسة
   القبطية الأرثوذكسية: أمين الخدمة ← مساعد الأمين ← أمناء
   المراحل/السنوات ← الخدام. هنا مخصصة لخدمة إعداد الخدام.
============================================================ */
const SESSION_KEY='e3dad_khoddam_session_v1';
const PERMISSIONS=[
 ['view_students','👥 عرض الدارسين وملفاتهم'],
 ['edit_students','✏️ إضافة وتعديل البيانات الثابتة للدارسين'],
 ['delete_students','🗑️ حذف دارس نهائياً (خطر)'],
 ['manage_years','📚 فتح سنوات ومحاولات وتعديل الحضور والخدمة'],
 ['enter_grades','📝 إدخال المواد والتقييمات والدرجات'],
 ['manage_activities','⭐ إدارة الأنشطة والتدريب العملي'],
 ['add_notes','🗒️ إضافة وتعديل الملاحظات والتقارير'],
 ['view_confidential','🔒 عرض الملاحظات السرية'],
 ['make_decisions','🏁 قرارات نهاية السنة (نقل / إعادة / تخرج)'],
 ['manage_curriculum','📖 إدارة المناهج وقوالب المواد'],
 ['print_reports','🖨️ طباعة التقارير وتصديرها'],
 ['manage_users','🔑 إدارة حسابات الخدام والصلاحيات'],
 ['manage_settings','⚙️ تعديل إعدادات الخدمة'],
 ['backup','💾 نسخ احتياطي واستيراد البيانات'],
];
const ALL_PERMS=PERMISSIONS.map(x=>x[0]);
const ROLE_DEFS={
 amin:{label:'أمين إعداد الخدام',icon:'👑',desc:'المسؤول الأول عن خدمة إعداد الخدام أمام الأب الكاهن المسؤول. كل الصلاحيات: حسابات الخدام، الإعدادات، الحذف النهائي، النسخ الاحتياطي، وقرارات نهاية السنة.',perms:ALL_PERMS},
 assistant:{label:'مساعد أمين إعداد الخدام',icon:'🤝',desc:'معاون الأمين وبديله عند غيابه. يدير الدارسين والسنوات والدرجات والقرارات وحسابات الخدام الأقل منه — بدون حذف نهائي وبدون إعدادات الخدمة الأساسية.',perms:['view_students','edit_students','manage_years','enter_grades','manage_activities','add_notes','view_confidential','make_decisions','manage_curriculum','print_reports','manage_users','backup']},
 year_supervisor:{label:'أمين سنة (مشرف سنة)',icon:'📌',desc:'مسؤول عن سنة دراسية معينة (أولى/ثانية/ثالثة) يحددها الأمين. يتابع دارسي سنته: درجات وأنشطة وملاحظات وتقارير — وقرارات نهاية السنة تظل للأمين ومساعده.',perms:['view_students','edit_students','manage_years','enter_grades','manage_activities','add_notes','print_reports']},
 khadem:{label:'خادم',icon:'✝️',desc:'خادم أو محاضر داخل الفصول. يدخل التقييمات والأنشطة ويكتب ملاحظات متابعة ويطبع تقارير — بدون تعديل البيانات الثابتة وبدون قرارات.',perms:['view_students','enter_grades','manage_activities','add_notes','print_reports']},
 follower:{label:'خادم متابِع (عرض فقط)',icon:'👁️',desc:'اطلاع وطباعة تقارير فقط، بدون أي إضافة أو تعديل. مناسب للمتابعة الرعوية أو مرحلة التعارف على الخدمة.',perms:['view_students','print_reports']},
};
function rolePerms(role){return [...(ROLE_DEFS[role]?.perms||ROLE_DEFS.follower.perms)]}
function currentUser(){try{const id=localStorage.getItem(SESSION_KEY); if(!id)return null; const at=+localStorage.getItem(SESSION_KEY+'_at')||0; if(at&&Date.now()-at>12*3600*1000){localStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_KEY+'_at'); return null} const u=(DB.users||[]).find(x=>x.id===id); return (u&&u.active!==false)?u:null}catch(e){return null}}
function effectivePerms(u){if(!u)return[]; if(u.role==='amin')return[...ALL_PERMS]; return Array.isArray(u.permissions)?u.permissions:rolePerms(u.role)}
function hasPerm(p){const u=currentUser(); return !!u && effectivePerms(u).includes(p)}
function canEdit(){return hasPerm('enter_grades')||hasPerm('edit_students')||hasPerm('manage_years')||hasPerm('add_notes')}
function isAdmin(){const u=currentUser(); return !!u&&u.role==='amin'}
function userAvatar(u){return u&&u.photo?`<img src="${u.photo}" alt="">`:`<span>${esc(initials(u?u.displayName:'خ'))}</span>`}
function logActivity(action){const u=currentUser(); DB.activityLog=DB.activityLog||[]; DB.activityLog.unshift({date:new Date().toLocaleString('ar-EG'),user:u?u.displayName+' ('+u.username+')':'—',action}); DB.activityLog=DB.activityLog.slice(0,120)}
function canAccessStudent(st){const u=currentUser(); if(!u)return false; const sc=u.scopeYears||[]; if(!sc.length)return true; const en=studentCurrent(st); if(!en)return false; return sc.includes(en.yearLevel)}
function canAccessEnrollment(en){const u=currentUser(); if(!u)return false; const sc=u.scopeYears||[]; return !sc.length||sc.includes(en.yearLevel)}
function fallbackHash(pw,salt){const txt=(salt||'')+'::'+pw; let h1=0xdeadbeef,h2=0x41c6ce57; for(let i=0;i<txt.length;i++){const c=txt.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677)} return 'fb'+(h1>>>0).toString(16)+(h2>>>0).toString(16)}
async function verifyPassword(pw,username,stored){ if(!stored)return false; if(await hashPassword(pw,username)===stored)return true; return fallbackHash(pw,username)===stored }
async function hashPassword(pw,salt){
  const txt=(salt||'')+'::'+pw;
  try{ if(window.crypto&&crypto.subtle){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')} }catch(e){}
  let h1=0xdeadbeef,h2=0x41c6ce57; for(let i=0;i<txt.length;i++){const c=txt.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677)} return 'fb'+(h1>>>0).toString(16)+(h2>>>0).toString(16);
}

function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function readPhotoFile(file,cb,maxSize=760){ if(!file)return; if(!/^image\//.test(file.type||''))return toast('اختر ملف صورة صحيح'); if(file.size>10*1024*1024)return toast('الصورة كبيرة جداً — اختر صورة أقل من ١٠ ميجا');
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url); const scale=Math.min(1,maxSize/Math.max(img.naturalWidth||1,img.naturalHeight||1)); const w=Math.max(1,Math.round(img.naturalWidth*scale)), h=Math.max(1,Math.round(img.naturalHeight*scale)); const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff8e8'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',.84))};
  img.onerror=()=>{URL.revokeObjectURL(url); toast('تعذر قراءة الصورة — جرّب صورة تانية')}; img.src=url;

/* ---------- الحسابات ---------- */
function subjFinal(sub){
 const scored=(sub.assessments||[]).filter(a=>a.score!==''&&a.score!=null&&!isNaN(+a.score));
 if(!scored.length) return null;
 const got=scored.reduce((s,a)=>s+(+a.score||0),0), max=scored.reduce((s,a)=>s+(+a.max||0),0);
 return max? Math.round(got/max*1000)/10 : null;
}
function subjStatus(sub){const f=subjFinal(sub); if(f==null)return null; return f>=DB.settings.passMark?'ناجح':'يحتاج إعادة'}
function enrollStats(en){
 const finals=(en.subjects||[]).map(subjFinal).filter(v=>v!=null);
 const subjAvg=finals.length? Math.round(finals.reduce((a,b)=>a+b,0)/finals.length*10)/10 : null;
 const acts=(en.activities||[]).filter(a=>a.score!==''&&a.score!=null&&a.max);
 const actAvg=acts.length? Math.round(acts.reduce((s,a)=>s+(+a.score/+a.max*100),0)/acts.length*10)/10 : null;
 let overall=subjAvg;
 if(subjAvg!=null&&actAvg!=null) overall=Math.round((subjAvg*0.8+actAvg*0.2)*10)/10;
 const att=(en.attendanceTotal>0)? Math.round(en.attendanceAttended/en.attendanceTotal*1000)/10 : null;
 const failed=(en.subjects||[]).filter(s=>subjStatus(s)==='يحتاج إعادة');
 return {subjAvg,actAvg,overall,att,failedCount:failed.length,failedNames:failed.map(s=>s.name),subjectsCount:(en.subjects||[]).length,doneSubjects:finals.length};
}
function gradeLabel(v){if(v==null)return'—'; if(v>=90)return'ممتاز'; if(v>=80)return'جيد جداً'; if(v>=70)return'جيد'; if(v>=DB.settings.passMark)return'ناجح'; return'يحتاج إعادة'}
function gradeClass(v){if(v==null)return''; if(v>=80)return''; if(v>=DB.settings.passMark)return'mid'; if(v>=40)return'low'; return'fail'}
function studentCurrent(st){return (st.enrollments||[])[(st.enrollments||[]).length-1]||null}
function studentOverallAvg(st){const vals=(st.enrollments||[]).map(e=>enrollStats(e).overall).filter(v=>v!=null); return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10:null}
function isAtRisk(st){const en=studentCurrent(st); if(!en||en.status!=='ongoing')return false; const s=enrollStats(en); return (s.overall!=null&&s.overall<65)||(s.att!=null&&s.att<DB.settings.attendanceWarn)||(en.serviceHours!=null&&en.serviceHours<DB.settings.serviceHoursTarget*0.4&&en.status==='ongoing')}
function avatarHTML(st,size){return st.photo?`<img src="${st.photo}" alt="">`:`<span>${esc(initials(st.name))}</span>`}

function filteredStudents(){
 const q=($('#fSearch')?.value||'').trim(), y=$('#fYear')?.value||'', fs=$('#fStatus')?.value||'', b=($('#fBatch')?.value||'').trim();
 return DB.students.filter(st=>{
  if(!canAccessStudent(st))return false;
  if(q && !(st.name.includes(q)||(st.code||'').includes(q)||(st.phone||'').includes(q)))return false;
  if(b && !(st.batch||'').includes(b))return false;
  if(y){const en=studentCurrent(st); if(!en||String(en.yearLevel)!==y)return false}
  if(fs==='risk')return isAtRisk(st);
  if(fs==='repeater')return (st.enrollments||[]).some(e=>e.attemptNo>1);
  if(fs)return st.status===fs;
  return true;
 });
}
function renderStudentList(){const el=$('#studentList'); if(!el)return; const list=filteredStudents();
 el.innerHTML= list.length? `<p style="color:var(--muted);font-size:13px">عرض ${list.length} من ${DB.students.length} دارس</p><div class="student-grid">${list.map(studentCard).join('')}</div>` : (DB.students.length? '<div class="card empty"><div class="big">🔍</div>لا توجد نتائج مطابقة للبحث</div>' : emptyState());}

function profileTimeline(st){
 const events=[];
 events.push({date:st.joinDate||st.createdAt||'',text:`📌 التحق بإعداد الخدام — كود ${st.code} (البيانات الثابتة والصورة محفوظة من اليوم ده)`});
 (st.enrollments||[]).forEach(en=>{ events.push({date:en.startDate||'',text:`📚 بدأ ${YEAR_NAMES[en.yearLevel]} — المحاولة رقم ${en.attemptNo} (${en.academicYear||''})`});
   (en.subjects||[]).forEach(sub=>{const f=subjFinal(sub); if(f!=null)events.push({date:en.endDate||en.startDate||'',text:`📖 ${en.yearLevel?YEAR_NAMES[en.yearLevel]:''} محاولة ${en.attemptNo} — مادة «${sub.name}»: النتيجة النهائية ${f}% (${gradeLabel(f)})`})});
   (en.activities||[]).forEach(a=>events.push({date:a.date||'',text:`⭐ نشاط: ${a.title} — ${a.status}${a.score!==''&&a.score!=null?` (${a.score}/${a.max})`:''}`}));
   if(en.status!=='ongoing')events.push({date:en.endDate||'',text:`🏁 نهاية محاولة ${en.attemptNo} من ${YEAR_NAMES[en.yearLevel]}: ${ATTEMPT_STATUS[en.status]||en.status}${en.decisionNote?' — '+en.decisionNote:''}`});
 });
 (st.notes||[]).forEach(n=>events.push({date:n.date||'',text:`📝 ${n.category}: ${n.title}`}));
 events.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
 return `<div class="card"><h3>السجل الكامل من أول يوم — القديم ما بيتمسحش</h3><div class="timeline">${events.map(e=>`<div class="tl-item"><div style="font-size:12px;color:var(--muted)">${esc(e.date||'—')}</div><div>${esc(e.text)}</div></div>`).join('')}</div></div>`;
}


/* ============================================================
   الحضور بالمحاضرات — كل محاضرة سجل مستقل، ونسبة الحضور في
   ملف الدارس بتتحدث تلقائياً، والغياب المتكرر = افتقاد.
============================================================ */
function sessionStudents(year){return DB.students.filter(st=>{if(!canAccessStudent(st))return false; const en=studentCurrent(st); return en&&en.yearLevel===year&&en.status==='ongoing'})}
function recalcEnrollmentAttendance(enrollmentId){
  DB.students.forEach(st=>{(st.enrollments||[]).forEach(en=>{ if(en.id!==enrollmentId)return;
    let total=0,att=0; (DB.attendanceSessions||[]).forEach(se=>{(se.records||[]).forEach(r=>{if(r.enrollmentId===enrollmentId){total++; if(r.status==='present'||r.status==='late')att++}})});
    if(total>0){en.attendanceTotal=(en._attBaseTotal||0)+total; en.attendanceAttended=(en._attBaseAttended||0)+att}
  })});
}
function recalcAllAttendance(){const ids=new Set(); (DB.attendanceSessions||[]).forEach(se=>(se.records||[]).forEach(r=>ids.add(r.enrollmentId))); ids.forEach(recalcEnrollmentAttendance)}
function attStatusLabel(v){return {present:'✅ حاضر',absent:'❌ غائب',late:'⏰ متأخر',excused:'📄 بعذر'}[v]||v}
function consecutiveAbsences(studentId,year){
  const sessions=(DB.attendanceSessions||[]).filter(se=>se.yearLevel===year).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); let count=0;
  for(const se of sessions){const r=(se.records||[]).find(x=>x.studentId===studentId); if(!r)continue; if(r.status==='absent')count++; else break}
  return count;
}

  const sessions=(DB.attendanceSessions||[]).filter(se=>se.yearLevel===y).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const studs=sessionStudents(y);
  const repeated=studs.map(st=>({st,n:consecutiveAbsences(st.id,y)})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n);
  return `<div class="card" style="margin-bottom:14px"><div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:space-between">

  ${repeated.length?`<div class="card" style="margin-bottom:14px;border-color:#f0b8b3"><h3>💗 غياب متكرر — دول أولى بالافتقاد والمكالمة</h3>${repeated.map(x=>{const en=studentCurrent(x.st);return `<div class="kv"><span><a href="#" onclick="go('profile','${x.st.id}');return false"><b>${esc(x.st.name)}</b></a> — غاب آخر <b>${x.n}</b> محاضرات ورا بعض</span><span style="display:flex;gap:6px;flex-wrap:wrap">${x.st.whatsapp||x.st.phone?`<a class="btn sm green" target="_blank" href="https://wa.me/${esc(String(x.st.whatsapp||x.st.phone).replace(/[^0-9]/g,'').replace(/^0/,'20'))}?text=${encodeURIComponent('أهلاً '+x.st.name+'، وحشتنا في إعداد الخدام ومفتقدينك. طمّنا عليك، ولو في أي حاجة معطّلاك إحنا جنبك ☦')}">💬 واتساب افتقاد</a>`:''}<button class="btn sm gold" onclick="quickFollowTask('${x.st.id}')">💗 مهمة متابعة</button></span></div>`}).join('')}</div>`:''}
  ${sessions.length? sessions.map(se=>{const c={present:0,absent:0,late:0,excused:0}; (se.records||[]).forEach(r=>c[r.status]=(c[r.status]||0)+1);

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${(se.records||[]).map(r=>{const st=getStudent(r.studentId); if(!st)return''; return `<span class="badge ${r.status==='present'?'b-green':r.status==='absent'?'b-red':r.status==='late'?'b-amber':'b-blue'}" title="${attStatusLabel(r.status)}">${esc(st.name)} ${r.status==='present'?'✅':r.status==='absent'?'❌':r.status==='late'?'⏰':'📄'}</span>`}).join('')}</div></div>`}).join('') : '<div class="card empty"><div class="big">✅</div>لسه مفيش محاضرات مسجلة للسنة دي — سجّل أول محاضرة من الزرار فوق</div>'}`;
}

function downloadImportTemplate(){
  const csv='الاسم,الكود,الدفعة,تاريخ الالتحاق,الهاتف,واتساب,النوع,تاريخ الميلاد,الكنيسة,أب الاعتراف,المؤهل\nأحمد سمير,D-101,دفعة 2026,2026-10-01,01001234567,01001234567,ذكر,2002-05-10,,أبونا داود,طالب جامعي\n';
  download(new Blob(['\ufeff'+csv],{type:'text/csv'}),'نموذج-استيراد-الدارسين.csv'); toast('نزل نموذج الاستيراد — عبّيه في Excel واحفظه CSV وارفعه');
}
function importStudentsCSV(text){
  const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2)return toast('الملف فاضي أو بدون صفوف');
  const head=lines[0].split(',').map(h=>h.trim());
  const idx=(names)=>{for(const n of names){const i=head.indexOf(n); if(i>=0)return i} return -1};
  const I={name:idx(['الاسم','name','اسم الدارس']),code:idx(['الكود','code']),batch:idx(['الدفعة','batch']),join:idx(['تاريخ الالتحاق','joinDate']),phone:idx(['الهاتف','phone','الموبايل']),whats:idx(['واتساب','whatsapp']),gender:idx(['النوع','gender']),birth:idx(['تاريخ الميلاد','birthDate']),church:idx(['الكنيسة','church']),father:idx(['أب الاعتراف','confessionFather']),edu:idx(['المؤهل','education','الوظيفة'])};
  if(I.name<0)return toast('لازم يكون في عمود «الاسم» في أول صف');
  let added=0,skipped=0;
  lines.slice(1).forEach(line=>{const c=line.split(',').map(x=>x.trim()); const name=c[I.name]; if(!name){skipped++;return}
    const code=I.code>=0&&c[I.code]?c[I.code]:('D-'+String(DB.students.length+added+1).padStart(3,'0'));
    if(DB.students.some(st=>st.code===code)){skipped++;return}
    DB.students.push({id:uid(),code,name,batch:I.batch>=0?c[I.batch]:'',joinDate:I.join>=0?c[I.join]:today(),phone:I.phone>=0?c[I.phone]:'',whatsapp:I.whats>=0?c[I.whats]:'',gender:I.gender>=0?c[I.gender]:'',birthDate:I.birth>=0?c[I.birth]:'',email:'',nationalId:'',address:'',education:I.edu>=0?c[I.edu]:'',church:I.church>=0?c[I.church]:'',confessionFather:I.father>=0?c[I.father]:'',status:'active',fixedNotes:'',photo:'',createdAt:today(),updatedAt:today(),enrollments:[],notes:[]}); added++;
  });
  logActivity('استورد '+added+' دارس من ملف CSV'); saveDB(); render(); toast('تم استيراد '+added+' دارس ✅'+(skipped?' (اتخطى '+skipped+' صف: فاضي أو كود مكرر)':''));
}

function enrollmentReportHTML(st,en,includeNotes){
 const s=enrollStats(en);

 if((en.activities||[]).length) h+=`<table style="margin-top:8px"><tr><th>النشاط / التدريب</th><th>النوع</th><th>التاريخ</th><th>ساعات</th><th>التقييم</th><th>الحالة</th></tr>${en.activities.map(a=>`<tr><td>${esc(a.title)}</td><td>${esc(a.type)}</td><td>${esc(a.date||'')}</td><td>${a.hours||0}</td><td>${a.score===''||a.score==null?'—':a.score+'/'+a.max}</td><td>${esc(a.status)}</td></tr>`).join('')}</table>`;
 return h;

function printStudentReport(studentId,mode){
 const st=getStudent(studentId); if(!st)return toast('اختر دارساً'); if(!hasPerm('print_reports'))return toast('صلاحية الطباعة غير مفعّلة لحسابك'); if(!canAccessStudent(st))return toast('الدارس خارج نطاقك');
 let ens=st.enrollments||[];
 if(mode==='latest') ens=ens.slice(-1);
 if(mode&&mode!=='all'&&mode!=='latest'){const en=ens.find(e=>e.id===mode); ens=en?[en]:[]}
 const includeNotes = confirm('تحب تضمّن الملاحظات والتقارير في التقرير المطبوع؟\n(الملاحظات السرية هتتخفى تلقائياً)');
 let h=reportHead('التقرير الشامل للدارس','سجل كامل بكل المحاولات — القديم محفوظ ولا يُستبدل')+studentInfoTable(st);
 h+=`<p style="font-size:13px">المتوسط العام عبر كل المحاولات: <b>${studentOverallAvg(st)??'—'}%</b> • عدد المحاولات المحفوظة: <b>${(st.enrollments||[]).length}</b></p>`;
 h+= ens.length? ens.map(en=>enrollmentReportHTML(st,en)).join('') : '<p>لم تبدأ أي سنة بعد.</p>';
 if(includeNotes&&(st.notes||[]).length){h+=`<h3 style="margin-top:18px">الملاحظات والتقارير</h3>`+st.notes.filter(n=>!n.confidential).map(n=>`<div style="border:1px solid #ddd;border-radius:8px;padding:10px;margin-bottom:8px"><b>${esc(n.title)}</b> — ${esc(n.category)} (${esc(n.date||'')})<div style="white-space:pre-wrap">${esc(n.body)}</div></div>`).join('')}
 h+=`<p style="font-size:11px;color:#777;margin-top:16px">ملحوظة: هذا التقرير يعرض كل المحاولات كما سُجلت وقتها. إعادة السنة أو المادة لا تحذف النتائج السابقة.</p>`;
 showPrint(h);
}
function groupRows(){
 const y=$('#gYear')?.value||'', b=($('#gBatch')?.value||'').trim(), mode=$('#gAttempts')?.value||'all', fs=$('#gStatus')?.value||'';
 let rows=[];
 DB.students.forEach(st=>{ if(!canAccessStudent(st))return; if(b&&!(st.batch||'').includes(b))return; if(fs&&st.status!==fs)return;
  let ens=st.enrollments||[]; if(y)ens=ens.filter(e=>String(e.yearLevel)===y);
  if(mode==='latest')ens=ens.slice(-1); if(mode==='repeat'&&!ens.some(e=>e.attemptNo>1))return;
  ens.forEach(en=>{const s=enrollStats(en); rows.push({name:st.name,code:st.code,batch:st.batch||'',year:YEAR_NAMES[en.yearLevel],attempt:en.attemptNo,status:ATTEMPT_STATUS[en.status]||en.status,overall:s.overall??'',att:s.att??'',service:en.serviceHours||0,failed:s.failedNames.join('، ')})});
 });
 return rows;
}

 showPrint(reportHead('تقرير مجموعة دارسين','كل المحاولات ظاهرة برقمها — القديم بجانب الجديد')+`<table><tr><th>الكود</th><th>الدارس</th><th>الدفعة</th><th>السنة</th><th>محاولة</th><th>الحالة</th><th>النتيجة</th><th>الحضور</th><th>خدمة</th><th>مواد تحتاج إعادة</th></tr>${rows.map(r=>`<tr><td>${esc(r.code)}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.batch)}</td><td>${r.year}</td><td>${r.attempt}</td><td>${esc(r.status)}</td><td><b>${r.overall!==''?r.overall+'%':'—'}</b></td><td>${r.att!==''?r.att+'%':'—'}</td><td>${r.service} س</td><td>${esc(r.failed||'—')}</td></tr>`).join('')}</table><p style="font-size:12px;color:#666">عدد الصفوف: ${rows.length} (كل صف = محاولة واحدة لدارس في سنة)</p>`)}
function exportGroupCSV(){const rows=groupRows(); if(!rows.length)return toast('لا توجد بيانات');
 const csv='الكود,الدارس,الدفعة,السنة,رقم المحاولة,الحالة,النتيجة %,الحضور %,ساعات الخدمة,مواد تحتاج إعادة\n'+rows.map(r=>[r.code,r.name,r.batch,r.year,r.attempt,r.status,r.overall,r.att,r.service,'"'+String(r.failed).replace(/"/g,'""')+'"'].join(',')).join('\n');
 download(new Blob(['\ufeff'+csv],{type:'text/csv'}),'group-report.csv')}

 const st=getStudent(studentId); const n=noteId?(st.notes||[]).find(x=>x.id===noteId):null;
 openModal(n?'تعديل ملاحظة / تقرير':'إضافة ملاحظة أو تقرير',`
 <div class="form-grid">${field('العنوان *','nTitle',n?.title)}
 <div class="field"><label>التصنيف</label><select id="nCat">${['ملاحظة مشرف','تقرير فردي','تقرير جماعي','تقييم نشاط','تقييم روحي','تقييم سلوكي','متابعة إعادة / خطة تحسين','قرار إداري','أخرى'].map(t=>`<option ${n?.category===t?'selected':''}>${t}</option>`).join('')}</select></div>
 ${field('التاريخ','nDate',n?.date||today(),'date')}${field('الكاتب / المشرف','nAuthor',n?.author)}
 <div class="field full"><label>نص الملاحظة / التقرير</label><textarea id="nBody" style="min-height:130px">${esc(n?.body||'')}</textarea></div>
 <label style="font-size:13px"><input type="checkbox" id="nConf" ${n?.confidential?'checked':''}> سري — لا يظهر في التقارير المطبوعة</label></div>`,
 ()=>{const title=$('#nTitle').value.trim(); if(!title)return toast('العنوان مطلوب');
  const data={title,category:$('#nCat').value,date:$('#nDate').value,author:$('#nAuthor').value.trim(),body:$('#nBody').value,confidential:$('#nConf').checked};
  if(n)Object.assign(n,data); else (st.notes=st.notes||[]).push({id:uid(),...data});
  st.updatedAt=today(); saveDB(); closeModal(); state.profileTab='notes'; render(); toast('تم حفظ الملاحظة ✅')});
}
function deleteNote(studentId,noteId){const st=getStudent(studentId); if(!confirm('حذف هذه الملاحظة نهائياً؟'))return; st.notes=st.notes.filter(n=>n.id!==noteId); saveDB(); render()}
function openDecisionForm(studentId,enrollId){
 if(!hasPerm('make_decisions'))return toast('قرارات نهاية السنة للأمين ومساعده فقط');
 const st=getStudent(studentId),en=st.enrollments.find(e=>e.id===enrollId); const s=enrollStats(en);
 const failed=s.failedNames;
 openModal(`إنهاء ${YEAR_NAMES[en.yearLevel]} — المحاولة ${en.attemptNo}`,`
 <div class="card" style="background:#f8fbff;box-shadow:none"><b>ملخص المحاولة:</b> النتيجة العامة ${s.overall??'—'}% • الحضور ${s.att??'—'}% • خدمة ${en.serviceHours||0} ساعة ${failed.length?`<br><span style="color:var(--red)"><b>مواد تحتاج إعادة:</b> ${esc(failed.join('، '))}</span>`:'<br><span style="color:var(--green)"><b>لا توجد مواد راسبة</b></span>'}</div>
 <div class="field" style="margin-top:12px"><label>القرار</label><select id="dChoice">
  ${en.yearLevel<3?'<option value="promote">✅ ناجح — انتقال للسنة التالية (تُفتح محاولة جديدة تلقائياً)</option>':''}
  ${en.yearLevel===3?'<option value="graduate">🎓 ناجح — تخرّج (إنهاء ٣ سنوات)</option>':''}
  <option value="repeat_year">🔁 إعادة السنة كاملة (محاولة جديدة — القديمة محفوظة)</option>
  <option value="repeat_courses">📖 إعادة المواد الراسبة فقط (محاولة جديدة فيها المواد الراسبة فقط)</option>
  <option value="paused">⏸️ إيقاف مؤقت</option><option value="withdrawn">🚪 انسحاب</option></select></div>
 <div class="field" style="margin-top:10px"><label>ملاحظة القرار (تظهر في السجل والتقارير)</label><textarea id="dNote" placeholder="مثال: إعادة السنة الثانية بسبب الظروف / النتيجة القديمة محفوظة في المحاولة ١"></textarea></div>
 <p style="font-size:12px;color:var(--muted)">⚠️ مهما كان القرار، <b>المحاولة الحالية بكل نتائجها هتفضل محفوظة زي ما هي</b> — القرار بس بيقفلها وبيفتح اللي بعدها.</p>`,
 ()=>{
  const choice=$('#dChoice').value, note=$('#dNote').value.trim();
  en.status = choice==='promote'||choice==='graduate'?'passed': choice==='repeat_year'?'repeat_year': choice==='repeat_courses'?'repeat_courses': choice;
  en.endDate=en.endDate||today(); en.decisionNote=note||en.decisionNote||'';
  if(choice==='graduate'){st.status='graduated'}
  if(choice==='withdrawn'){st.status='withdrawn'}
  if(choice==='paused'){st.status='paused'}
  if(choice==='promote'&&en.yearLevel<3){st.status='active'; st.enrollments.push({id:uid(),yearLevel:en.yearLevel+1,attemptNo:(st.enrollments.filter(e=>e.yearLevel===en.yearLevel+1).length+1),academicYear:'',startDate:today(),endDate:'',status:'ongoing',attendanceAttended:0,attendanceTotal:0,serviceHours:0,spiritualMeetings:0,decisionNote:'',subjects:(DB.templates[en.yearLevel+1]||[]).map(([name,cat])=>({id:uid(),name,category:cat,teacher:'',assessments:defaultAssessments()})),activities:[]})}
  if(choice==='repeat_year'){st.status='active'; st.enrollments.push({id:uid(),yearLevel:en.yearLevel,attemptNo:en.attemptNo+1,academicYear:'',startDate:today(),endDate:'',status:'ongoing',attendanceAttended:0,attendanceTotal:0,serviceHours:0,spiritualMeetings:0,decisionNote:'إعادة سنة — المحاولة السابقة ('+en.attemptNo+') محفوظة بنتائجها',subjects:(DB.templates[en.yearLevel]||[]).map(([name,cat])=>({id:uid(),name,category:cat,teacher:'',assessments:defaultAssessments()})),activities:[]})}
  if(choice==='repeat_courses'){st.status='active'; const failedSubs=(en.subjects||[]).filter(x=>subjStatus(x)==='يحتاج إعادة'); st.enrollments.push({id:uid(),yearLevel:en.yearLevel,attemptNo:en.attemptNo+1,academicYear:'',startDate:today(),endDate:'',status:'ongoing',attendanceAttended:0,attendanceTotal:0,serviceHours:0,spiritualMeetings:0,decisionNote:'إعادة مواد: '+(failedSubs.map(x=>x.name).join('، ')||'—')+' — نتائج المحاولة '+en.attemptNo+' محفوظة',subjects:failedSubs.map(x=>({id:uid(),name:x.name,category:x.category,teacher:x.teacher||'',assessments:defaultAssessments()})),activities:[]})}
  st.updatedAt=today(); saveDB(); closeModal(); render(); toast('تم تنفيذ القرار ✅ — السجل القديم محفوظ كما هو');
 },'🏁 تنفيذ القرار');
}

/* ---------- بيانات تجريبية ---------- */
function demoStudent(code,name,batch,join,phone,father){return{id:uid(),code,name,batch,joinDate:join,phone,whatsapp:phone,gender:'ذكر',birthDate:'2002-05-10',email:'',nationalId:'',address:'القاهرة',education:'طالب جامعي',church:'',confessionFather:father,status:'active',fixedNotes:'',photo:'',createdAt:join,updatedAt:today(),notes:[],enrollments:[]}}
function mkEn(year,attempt,acad,status,subs,acts,attA,attT,service,spirit,decision){return{id:uid(),yearLevel:year,attemptNo:attempt,academicYear:acad,startDate:acad.split(' / ')[0]+'-10-01',endDate:status==='ongoing'?'':(acad.split(' / ')[1]||'')+'-06-30',status,attendanceAttended:attA,attendanceTotal:attT,serviceHours:service,spiritualMeetings:spirit,decisionNote:decision||'',subjects:subs,activities:acts||[]}}
function mkSub(name,cat,scores){const defs=defaultAssessments(); scores.forEach((v,i)=>{if(defs[i])defs[i].score=v}); return{id:uid(),name,category:cat,teacher:'',assessments:defs}}

/* ---------- أحداث عامة ---------- */
/* الصلاحيات لم تعد تبديلاً من قائمة — كل خادم يدخل بحسابه ودوره من صفحة «الخدام والصلاحيات» */
$('#csvFile').addEventListener('change',e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>importStudentsCSV(String(r.result||'')); r.readAsText(f); e.target.value=''});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{try{const d=JSON.parse(r.result); if(!Array.isArray(d.students))throw 0; if(!confirm('استيراد النسخة هيستبدل البيانات الحالية على الجهاز. أكمل؟'))return; DB=d; DB.settings={...defaultSettings(),...(d.settings||{})}; DB.users=DB.users||[]; DB.activityLog=DB.activityLog||[]; saveDB(); if(currentUser()){go('dashboard')}else{location.href='index.html'} toast('تم استيراد النسخة الاحتياطية ✅')}catch(_){toast('ملف غير صالح')}}; r.readAsText(f); e.target.value=''});
window.addEventListener('online',()=>$('#offlineBar').classList.remove('show'));
window.addEventListener('offline',()=>$('#offlineBar').classList.add('show'));
if(!navigator.onLine)$('#offlineBar').classList.add('show');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault(); deferredPrompt=e});
window.addEventListener('appinstalled',()=>{deferredPrompt=null; toast('تم تثبيت «اعداد خدام ادمن» على جهازك ☦📲')});
if('serviceWorker' in navigator && location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(window.E3Cloud){E3Cloud.init({dbKey:DB_KEY,badge:true,onRemote:()=>{
  DB=loadDB();
  if(!currentUser()){location.href='index.html';return}
  const a=document.activeElement, modal=$('#modalBg');
  if((a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))||(modal&&modal.classList.contains('open')))return;
  render();
}})}
if(currentUser()){render()}else{location.href='index.html'}
